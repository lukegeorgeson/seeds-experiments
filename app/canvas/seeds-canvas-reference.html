<!DOCTYPE html>

<style>
  html, body, #root {
    width: 100%;
    height: 100%;

    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .modifier-node {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    width: 100%;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .modifier-node-label {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--fg-3);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .modifier-node-label svg {
    width: 11px;
    height: 11px;
  }

  .modifier-node-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--fg-2);
  }

  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-left: -1px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-2);
    cursor: pointer;

    background: var(--fg);
    color: var(--bg);
  }

    width: 15px;

    case 'copy': return <svg {...props}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>;
    case 'layers': return <svg {...props}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
    case 'move': return <svg {...props}><polyline points="5 9 2 12 5 15"/><polyline points="9 5 12 2 15 5"/><polyline points="15 19 12 22 9 19"/><polyline points="19 9 22 12 19 15"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="12" y1="2" x2="12" y2="22"/></svg>;
    case 'star-filled': return <svg {...props} fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    case 'corner-right-down': return <svg {...props}><polyline points="10 15 15 20 20 15"/><path d="M4 4h7a4 4 0 0 1 4 4v12"/></svg>;
    case 'palette': return <svg {...props}><circle cx="13.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r="0.5" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r="0.5" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12" r="0.5" fill="currentColor" stroke="none"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.04-.23-.29-.38-.63-.38-1.02 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-5.17-4.49-9-10-9z"/></svg>;
    default: return null;

}

const ContextMenuContext = React.createContext();

function ContextMenuProvider({ children }) {
  const [menu, setMenu] = React.useState(null);
  React.useEffect(() => {
    const close = () => setMenu(null);
    document.addEventListener('click', close);
    document.addEventListener('contextmenu', close);
    return () => {
      document.removeEventListener('click', close);
      document.removeEventListener('contextmenu', close);
    };
  }, []);
  return (
    <ContextMenuContext.Provider value={{ menu, setMenu }}>
      {children}
      {menu && (
        <div className="context-menu" style={{ left: menu.x, top: menu.y }} onClick={(e) => e.stopPropagation()}>
          {menu.items.map((item, index) => {
            if (item.divider) return <div key={index} className="context-menu-divider" />;
            return (
              <button key={index} className={`context-menu-item ${item.danger ? 'danger' : ''}`} onClick={() => { item.action(); setMenu(null); }}>
                {item.icon && <Icon type={item.icon} size={13} />}
                {item.label}
              </button>
            );
          })}
        </div>
      )}
    </ContextMenuContext.Provider>
  );
}

function PostItNode({ data, id }) {
  const { setNodes } = useReactFlow();
  const { setMenu } = React.useContext(ContextMenuContext);

  const handleReject = (e) => {
    if (e) e.stopPropagation();
    const el = document.querySelector(`[data-id="${id}"] .postit-node`);
    if (el) el.classList.add('rejecting');
    setTimeout(() => {
      setNodes((nds) => nds.filter((n) => n.id !== id));
      showToast('rejected');
    }, 200);
  };

  const handleStar = (e) => {
    if (e) e.stopPropagation();
    setNodes((nds) => nds.map((n) => n.id === id ? { ...n, data: { ...n.data, starred: !n.data.starred } } : n));
    showToast(data.starred ? 'unstarred' : 'starred');
  };

  const handleRiff = (e) => {
    if (e) e.stopPropagation();
    showToast('riffing...');
  };

  const handleDuplicate = () => {
    setNodes((nds) => {
      const orig = nds.find((n) => n.id === id);
      if (!orig) return nds;
      return [...nds, { ...orig, id: `card-dup-${Date.now()}`, position: { x: orig.position.x + 20, y: orig.position.y + 20 }, data: { ...orig.data } }];
    });
    showToast('duplicated');
  };

  const handleDistill = (e) => {
    if (e) e.stopPropagation();
    const el = document.querySelector(`[data-id="${id}"] .postit-node`);
    if (el) el.classList.add('distilling');
    setTimeout(() => { if (el) el.classList.remove('distilling'); }, 300);
    setNodes((nds) => {
      const distilledZone = nds.find((n) => n.id === 'zone-distilled');
      if (!distilledZone) return nds;
      const childrenInZone = nds.filter((n) => n.parentId === 'zone-distilled');
      const CARD_SIZE = 180;
      const CARD_GAP = 20;
      const COLS = 2;
      const ci = childrenInZone.length;
      const cx = snap(20 + (ci % COLS) * (CARD_SIZE + CARD_GAP));
      const cy = snap(44 + Math.floor(ci / COLS) * (CARD_SIZE + CARD_GAP));
      const newCard = {
        id: `distill-${Date.now()}`,
        type: 'postit',
        position: { x: cx, y: cy },
        parentId: 'zone-distilled',
        extent: 'parent',
        data: { ...data, color: data.color, starred: true },
        draggable: true,
      };
      return [...nds, newCard];
    });
    showToast('distilled');
  };

  const onContextMenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setMenu({
      x: e.clientX,
      y: e.clientY,
      items: [
        { label: 'Riff on this', icon: 'corner-right-down', action: handleRiff },
        { label: data.starred ? 'Remove star' : 'Star', icon: 'star-filled', action: handleStar },
        { label: 'Duplicate', icon: 'copy', action: handleDuplicate },
        { label: 'Distill', icon: 'corner-right-down', action: handleDistill },
        { label: 'Move to zone...', icon: 'move', action: () => showToast('move to zone...') },
        { divider: true },
        { label: 'Reject', icon: 'trash', action: handleReject, danger: true },
      ],
    });
  };

  return (
    <div className="postit-node" data-color={data.color} onContextMenu={onContextMenu}>
      {data.starred && <div className="postit-star-badge">{'\u2605'}</div>}
      <div className="postit-type">{data.type}</div>
      <div className="postit-text">{data.text}</div>
      <div className="postit-actions">
        <button className="postit-action reject" onClick={handleReject} title="Reject">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="11" height="11"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <button className="postit-action star" onClick={handleStar} title="Star">{data.starred ? '\u2605' : '\u2606'}</button>
        <button className="postit-action riff" onClick={handleRiff} title="Riff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="11" height="11"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button className="postit-distill nodrag" onClick={handleDistill} title="Distill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="11" height="11" strokeLinecap="round" strokeLinejoin="round"><polyline points="10 15 15 20 20 15"/><path d="M4 4h7a4 4 0 0 1 4 4v12"/></svg>
        </button>
      </div>
      <Handle type="target" position={Position.Top} id="top" />
      <Handle type="source" position={Position.Bottom} id="bottom" />
      <Handle type="target" position={Position.Left} id="left" />
      <Handle type="source" position={Position.Right} id="right" />
    </div>
  );
}

function ZoneNode({ data, id }) {
  const { setNodes, getNodes, getNode, getViewport } = useReactFlow();
  const { setMenu } = React.useContext(ContextMenuContext);

  const handleAddCard = (e) => { e.stopPropagation(); showToast('add card'); };
  const handleGenerate = (e) => { e.stopPropagation(); showToast('generating...'); };
  const handleDelete = (e) => {
    e.stopPropagation();
    setNodes((nds) => nds.filter((n) => n.id !== id && n.parentId !== id));
    showToast('zone removed');
  };

  const onContextMenu = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setMenu({
      x: e.clientX,
      y: e.clientY,
      items: [
        { label: 'Add card', icon: 'plus', action: () => showToast('add card') },
        { label: 'Generate ideas', icon: 'sparkles', action: () => showToast('generating...') },
        { label: 'Rename zone', icon: 'edit', action: () => showToast('rename') },
        { divider: true },
        { label: 'Delete zone', icon: 'trash', action: () => { setNodes((nds) => nds.filter((n) => n.id !== id && n.parentId !== id)); showToast('zone removed'); }, danger: true },
      ],
    });
  };

  const GUTTER = 40;
  const makeResizeHandler = React.useCallback((corner) => (e) => {
    e.stopPropagation();
    e.preventDefault();
    setNodes((nds) => nds.map((n) => n.id === id ? { ...n, draggable: false } : n));
    const node = getNode(id);
    const startX = e.clientX;
    const startY = e.clientY;
    const startW = parseFloat((node && node.style && node.style.width) || 600);
    const startH = parseFloat((node && node.style && node.style.height) || 500);
    const startPosX = node.position.x;
    const startPosY = node.position.y;
    const allNodes = getNodes();
    const siblingStarts = {};

    allNodes.forEach((n) => {
      if (n.id !== id && !n.parentId) {
        siblingStarts[n.id] = {
          x: n.position.x,
          y: n.position.y,
          w: parseFloat((n.style && n.style.width) || (n.type === 'postit' ? 180 : n.type === 'generate' ? 200 : n.type === 'modifier' ? 220 : n.type === 'brief' ? 260 : n.type === 'question' ? 360 : 600)),
          h: parseFloat((n.style && n.style.height) || (n.type === 'postit' ? 180 : n.type === 'generate' ? 160 : n.type === 'modifier' ? 100 : n.type === 'brief' ? 200 : n.type === 'question' ? 400 : 500)),
        };
      }
    });

    const onMove = (ev) => {
      ev.preventDefault();
      const vp = getViewport();
      const z = vp.zoom || 1;
      const dx = (ev.clientX - startX) / z;
      const dy = (ev.clientY - startY) / z;
      let newW = startW;
      let newH = startH;
      let newX = startPosX;
      let newY = startPosY;

      if (corner === 'br' || corner === 'r' || corner === 'tr') newW = Math.max(400, startW + dx);
      if (corner === 'bl' || corner === 'l' || corner === 'tl') {
        newW = Math.max(400, startW - dx);
        newX = startPosX + (startW - newW);
      }
      if (corner === 'br' || corner === 'b' || corner === 'bl') newH = Math.max(300, startH + dy);
      if (corner === 'tl' || corner === 't' || corner === 'tr') {
        newH = Math.max(300, startH - dy);
        newY = startPosY + (startH - newH);
      }

      newW = snap(newW);
      newH = snap(newH);
      newX = snap(newX);
      newY = snap(newY);

      const growsRight = corner === 'br' || corner === 'r' || corner === 'tr';
      const growsLeft = corner === 'bl' || corner === 'l' || corner === 'tl';
      const growsDown = corner === 'br' || corner === 'b' || corner === 'bl';
      const growsUp = corner === 'tl' || corner === 't' || corner === 'tr';

      setNodes((nds) => nds.map((n) => {
        if (n.id === id) {
          return { ...n, position: { x: newX, y: newY }, draggable: false, style: { ...n.style, width: newW, height: newH } };
        }
        if (n.parentId) return n;

        const s = siblingStarts[n.id];
        if (!s) return n;

        const nW = s.w;
        const nH = s.h;
        let nX = n.position.x;
        let nY = n.position.y;

        if (growsRight || growsLeft) {
          const vertOverlap = newY < s.y + nH && newY + newH > s.y;
          if (vertOverlap) {
            if (growsRight && s.x >= startPosX + startW) {
              const targetX = snap(newX + newW + GUTTER);
              if (targetX > nX) nX = targetX;
            }
            if (growsLeft && s.x + s.w <= startPosX) {
              const targetX = snap(newX - GUTTER - s.w);
              if (targetX < nX) nX = targetX;
            }
          }
        }

        if (growsDown || growsUp) {
          const horizOverlap = newX < s.x + nW && newX + newW > s.x;
          if (horizOverlap) {
            if (growsDown && s.y >= startPosY + startH) {
              const targetY = snap(newY + newH + GUTTER);
              if (targetY > nY) nY = targetY;
            }
            if (growsUp && s.y + s.h <= startPosY) {
              const targetY = snap(newY - GUTTER - s.h);
              if (targetY < nY) nY = targetY;
            }
          }
        }

        if (nX === n.position.x && nY === n.position.y) return n;
        return { ...n, position: { x: nX, y: nY } };
      }));
    };

    const onUp = () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      setNodes((nds) => nds.map((n) => n.id === id ? { ...n, draggable: true } : n));
    };

    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }, [id, getNode, getNodes, setNodes, getViewport]);

  return (
    <div className="zone-node" data-zone-color={data.color} onContextMenu={onContextMenu}>
      <div className="zone-header">
        <span className="zone-label">{data.label}</span>
        <div className="zone-actions">
          <button className="zone-action-btn" onClick={handleAddCard} title="Add card">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button className="zone-action-btn" onClick={handleGenerate} title="Generate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 3l1.45 4.35L18 9l-4.55 1.65L12 15l-1.45-4.35L6 9l4.55-1.65L12 3z"/></svg>
          </button>

function QuestionNode({ data }) {
  const [currentQ, setCurrentQ] = React.useState(0);
  const [answers, setAnswers] = React.useState({});
  const [customInputs, setCustomInputs] = React.useState({});
  const [revealed, setRevealed] = React.useState(1);
  const questions = data.questions || SAMPLE_QUESTIONS;
  const allDone = Object.keys(answers).length >= questions.length;

  const advance = (qIdx) => {
    setTimeout(() => {
      if (qIdx + 1 < questions.length) {
        setRevealed((r) => Math.max(r, qIdx + 2));
        setCurrentQ(qIdx + 1);
      } else {
        setCurrentQ(questions.length);
      }
    }, 400);
  };

  const selectOption = (qIdx, value) => {
    setAnswers((prev) => ({ ...prev, [qIdx]: value }));
    advance(qIdx);
  };

  const submitCustom = (qIdx) => {
    const val = (customInputs[qIdx] || '').trim();
    if (!val) return;
    selectOption(qIdx, val);
  };

  const skipQuestion = () => {
    setAnswers((prev) => ({ ...prev, [currentQ]: 'Skipped' }));
    advance(currentQ);
  };

  return (
    <div className="question-node">
      <div className="question-node-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Questions</span>
        <span style={{ marginLeft: 'auto', fontSize: '10px', color: 'var(--fg-3)' }}>{Object.keys(answers).length}/{questions.length}</span>
      </div>
      <Handle type="target" position={Position.Left} id="q-in" />
      <Handle type="source" position={Position.Right} id="q-out" />

      {questions.slice(0, revealed).map((q, qi) => {
        if (qi >= currentQ || !answers[qi]) return null;
        return (
          <div key={qi} className="question-answered">
            <span className="question-answered-q">Q{qi + 1}. {q.text}</span>
            <span className={`question-answered-a${answers[qi] === 'Skipped' ? ' skipped' : ''}`}>{answers[qi]}</span>
          </div>
        );
      })}

      {!allDone && currentQ < questions.length && (
        <div style={{ marginTop: currentQ > 0 ? 8 : 0 }}>
          <div className="question-text">{currentQ + 1}. {questions[currentQ].text}</div>
          <div className="question-options">
            {questions[currentQ].options.map((opt) => (
              <button key={opt.key} className={`question-option nodrag ${answers[currentQ] === opt.text ? 'selected' : ''}`} onClick={() => selectOption(currentQ, opt.text)}>
                <span className="question-option-key">{opt.key}</span>
                <span className="question-option-text">{opt.text}</span>
              </button>
            ))}
            <div className="question-option-custom nodrag">
              <span className="question-option-key">E</span>
              <input
                className="question-custom-input"
                type="text"
                placeholder="Type your own answer..."
                value={customInputs[currentQ] || ''}
                onChange={(e) => setCustomInputs((prev) => ({ ...prev, [currentQ]: e.target.value }))}
                onKeyDown={(e) => { if (e.key === 'Enter') submitCustom(currentQ); }}
              />
            </div>
          </div>
          <button className="question-skip nodrag" onClick={skipQuestion}>Skip</button>
        </div>
      )}

      {allDone && (
        <div className="question-complete">
          <span className="question-complete-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{ width: 16, height: 16 }}><path d="M20 6L9 17l-5-5"/></svg>
          </span>
          <span className="question-complete-text">All questions answered — ready to generate</span>
        </div>
      )}
    </div>
  );
}

let toastTimeout;
function showToast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => el.classList.remove('show'), 1500);
}

    setNodes((nds) => [...nds, {
      id: `zone-new-${Date.now()}`,
      type: 'zone',
      position: { x: cx - 300, y: cy - 250 },
      data: { label: zoneType.label, color },
      style: { width: 600, height: 500 },
      draggable: true,
      selectable: true,
    }]);
    setShowNewBlock(false);
    showToast(`added ${zoneType.label}`);
  }, [reactFlowInstance, setNodes]);

  const addModifierNode = React.useCallback((nodeInfo) => {
    const vp = reactFlowInstance.getViewport();
    const cx = (-vp.x + window.innerWidth / 2) / vp.zoom;
    const cy = (-vp.y + window.innerHeight / 2) / vp.zoom;
    setNodes((nds) => [...nds, {
      id: `modifier-${Date.now()}`,
      type: 'modifier',
      position: { x: cx - 90, y: cy - 50 },
      data: { label: nodeInfo.label, iconType: nodeInfo.iconType, text: nodeInfo.defaultText },
      style: { width: 180, height: 100 },
      draggable: true,
    }]);
    setShowNewNode(false);
    showToast(`added ${nodeInfo.label}`);
  }, [reactFlowInstance, setNodes]);

  React.useEffect(() => {
    const handler = (e) => {
      if (!e.target.closest('.new-block-btn') && !e.target.closest('.dropdown-menu')) {
        setShowNewBlock(false);
        setShowNewNode(false);
      }
      if (!e.target.closest('.theme-picker-wrapper')) {
        setShowThemePicker(false);
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  return (
    <>
      <div className="logo-fixed">Seeds</div>

      <div className="top-right-bar">
        <button className="btn-icon" onClick={() => setDarkMode(!darkMode)} title={darkMode ? 'Light mode' : 'Dark mode'}>
          {darkMode ? <Icon type="sun" size={14} /> : <Icon type="moon" size={14} />}
        </button>
        <div className="theme-picker-wrapper">
          <button className="theme-picker-btn" onClick={() => setShowThemePicker(!showThemePicker)} title="Theme">
            <Icon type="palette" size={14} />
          </button>
          {showThemePicker && (
            <div className="theme-picker-dropdown">
              <div className="dropdown-section-label" style={{ padding: '5px 12px 3px' }}>Color</div>
              {COLORWAYS.filter((c) => c.group === 'color').map((cw) => (
                <button key={cw.id} className={`theme-picker-item ${colorway === cw.id ? 'active' : ''}`} onClick={() => { setColorway(cw.id); setShowThemePicker(false); }}>
                  <div className="theme-picker-swatch" style={{ background: cw.swatch }} />
                  {cw.label}
                </button>
              ))}
              <div className="theme-picker-divider" />
              <div className="dropdown-section-label" style={{ padding: '5px 12px 3px' }}>Mono</div>
              {COLORWAYS.filter((c) => c.group === 'mono').map((cw) => (
                <button key={cw.id} className={`theme-picker-item ${colorway === cw.id ? 'active' : ''}`} onClick={() => { setColorway(cw.id); setShowThemePicker(false); }}>
                  <div className="theme-picker-swatch" style={{ background: cw.swatch }} />
                  {cw.label}
                </button>
              ))}
            </div>
          )}
        </div>
        <div className="user-avatar" title="Account"><Icon type="user" size={15} /></div>
      </div>

      <ReactFlow
        nodes={nodes}
        edges={edges}
        onNodesChange={onNodesChange}
        onEdgesChange={onEdgesChange}
        onConnect={onConnect}
        nodeTypes={nodeTypes}
        onMoveEnd={onMoveEnd}
        onPaneContextMenu={onPaneContextMenu}
        panOnDrag={tool === 'hand' ? true : [1, 2]}
        selectionOnDrag={tool === 'select'}
        fitView
        fitViewOptions={{ padding: 0.15 }}
        minZoom={0.1}
        maxZoom={3}
        snapToGrid
        snapGrid={[GRID, GRID]}
        defaultEdgeOptions={{ type: 'smoothstep' }}
        proOptions={{ hideAttribution: true }}
        connectionLineStyle={{ stroke: 'var(--connection)', strokeWidth: 1.5, strokeDasharray: '6 3' }}
      >
        <Background variant="dots" color="var(--dot-color)" gap={20} size={2} />
      </ReactFlow>

      <div className="floating-toolbar">
        <button className={`toolbar-btn ${tool === 'select' ? 'active' : ''}`} onClick={() => setTool('select')} title="Select">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
        </button>
        <button className={`toolbar-btn ${tool === 'hand' ? 'active' : ''}`} onClick={() => setTool('hand')} title="Pan">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v6M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/>
            <path d="M18 8a2 2 0 0 1 2 2v7.4a4 4 0 0 1-.68 2.22L16.8 23.1a1 1 0 0 1-.85.47H8.73a1 1 0 0 1-.79-.39l-3.6-4.68A2 2 0 0 1 4 17.5a2 2 0 0 1 2-2h.59"/>
          </svg>
        </button>
        <div className="toolbar-divider"></div>
        <div style={{ position: 'relative' }}>
          <button className="new-block-btn" onClick={() => { setShowNewBlock(!showNewBlock); setShowNewNode(false); }}>
            <Icon type="plus" size={14} /> Block
          </button>
          {showNewBlock && (
            <div className="dropdown-menu">
              {ZONE_TYPES.map((zt, i) => (
                <button key={i} className="dropdown-item" onClick={() => addZone(zt)}><Icon type={zt.iconType} size={13} />{zt.label}</button>
              ))}
            </div>
          )}
        </div>
        <div style={{ position: 'relative' }}>
          <button className="new-block-btn" onClick={() => { setShowNewNode(!showNewNode); setShowNewBlock(false); }}>
            <Icon type="cube" size={14} /> Node
          </button>
          {showNewNode && (
            <div className="dropdown-menu">
              <div className="dropdown-section-label">Modifiers</div>
              {NODE_TYPES_MENU.map((nt, i) => (
                <button key={i} className="dropdown-item" onClick={() => addModifierNode(nt)}><Icon type={nt.iconType} size={13} />{nt.label}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      <div className="zoom-controls">
        <button className="zoom-btn" onClick={() => reactFlowInstance.zoomIn({ duration: 150 })}>+</button>
        <div className="zoom-level">{Math.round(zoom * 100)}%</div>
        <button className="zoom-btn" onClick={() => reactFlowInstance.zoomOut({ duration: 150 })}>{'\u2212'}</button>
        <button className="zoom-btn" onClick={() => reactFlowInstance.fitView({ duration: 200, padding: 0.15 })} title="Fit view" style={{ fontSize: '11px' }}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" width="12" height="12"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>
    </>
  );
}

function Root() {
  return (
    <ContextMenuProvider>
      <ReactFlowProvider>
        <App />
      </ReactFlowProvider>
    </ContextMenuProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
