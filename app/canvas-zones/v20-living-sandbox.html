<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V20 Living Sandbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react/": "https://esm.sh/react@18/",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/": "https://esm.sh/react-dom@18/",
      "@xyflow/react": "https://esm.sh/@xyflow/react@12?external=react,react-dom",
      "@xyflow/react/": "https://esm.sh/@xyflow/react@12&external=react,react-dom/"
    }
  }
  </script>
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0d0d11; color: #e0e0e0; }
    .syne { font-family: 'Syne', sans-serif; }

    /* Noise overlay */
    .noise-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.015;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px;
    }

    .zone-premium {
      border-radius: 14px;
      width: 100%; height: 100%;
      position: relative;
    }
    .zone-premium-label {
      position: absolute;
      top: -14px;
      left: 16px;
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 10px;
      border-radius: 6px;
      background: #0d0d11;
      z-index: 2;
    }
    .zone-premium-meta {
      position: absolute;
      top: -12px;
      right: 16px;
      font-size: 10px;
      color: #444;
      background: #0d0d11;
      padding: 2px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    .card-translucent {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 12px 14px 12px 18px;
      width: 200px;
      font-size: 13px;
      line-height: 1.45;
      color: #c8c8c8;
      transition: all 0.3s;
      position: relative;
    }
    .card-translucent:hover {
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .card-translucent .type-bar {
      width: 2px; border-radius: 1px;
      position: absolute; left: 4px; top: 8px; bottom: 8px;
    }
    .card-translucent.selected {
      border-color: rgba(234,193,245,0.25);
      box-shadow: 0 0 12px rgba(234,193,245,0.06);
    }
    .card-translucent.locked {
      border-color: rgba(234,193,245,0.35);
      border-width: 1.5px;
    }
    .card-translucent.rejected {
      opacity: 0.25;
      border-color: rgba(239,68,68,0.15);
    }

    .summary-premium {
      background: rgba(234,193,245,0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(234,193,245,0.12);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.55;
      color: #b8b0c8;
      position: relative;
    }
    .summary-premium .label {
      font-family: 'Syne', sans-serif;
      font-size: 10px;
      font-weight: 600;
      color: #eac1f5;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .riff-card-premium {
      background: rgba(255,255,255,0.03);
      border: 1.5px dashed rgba(234,193,245,0.3);
      border-radius: 10px;
      padding: 12px 14px;
      width: 190px;
      font-size: 13px;
      line-height: 1.45;
      color: #b0a8c0;
      position: relative;
    }
    .riff-badge-sm {
      font-size: 9px;
      color: #c99dd6;
      margin-bottom: 4px;
      font-weight: 500;
    }

    .collapsed-premium {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }
    .collapsed-edge {
      width: 3px; height: 24px; border-radius: 2px; flex-shrink: 0;
    }
    .collapsed-text {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: #aaa;
      flex-shrink: 0;
    }
    .collapsed-preview {
      font-size: 11px;
      color: #555;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .collapsed-count {
      font-size: 10px; color: #444;
      background: rgba(255,255,255,0.03);
      padding: 2px 6px; border-radius: 4px;
      flex-shrink: 0;
    }

    @keyframes dashOffset {
      to { stroke-dashoffset: -24; }
    }

    .command-palette {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      background: #18181e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      z-index: 200;
    }
    .cmd-input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px;
      font-size: 14px;
      color: #e0e0e0;
      font-family: 'Inter', sans-serif;
      outline: none;
      box-sizing: border-box;
    }
    .cmd-input::placeholder { color: #555; }
    .cmd-divider { height: 1px; background: rgba(255,255,255,0.04); margin: 0 4px; }
    .cmd-item {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #999;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s;
    }
    .cmd-item:hover { background: rgba(255,255,255,0.04); color: #ddd; }
    .cmd-item .icon { font-size: 14px; width: 20px; text-align: center; }
    .cmd-shortcut {
      margin-left: auto;
      font-size: 10px;
      color: #444;
      background: rgba(255,255,255,0.03);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .bottom-toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 2px;
      background: rgba(24,24,30,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 6px 8px;
      z-index: 100;
    }
    .bottom-toolbar button {
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 500;
      color: #777;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }
    .bottom-toolbar button:hover { background: rgba(255,255,255,0.05); color: #ccc; }
    .bottom-toolbar button.active {
      background: rgba(234,193,245,0.12);
      color: #eac1f5;
    }

    .top-bar-premium {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(13,13,17,0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .react-flow__background { opacity: 0.2; }
    .react-flow__controls button { background: #1a1a1e !important; color: #777 !important; border-color: #252528 !important; }
    .react-flow__minimap { background: #111115 !important; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="root" style="width:100vw;height:100vh;"></div>
  <div class="noise-overlay"></div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      ReactFlow,
      Background,
      Controls,
      MiniMap,
      useNodesState,
      useEdgesState,
      Handle,
      Position,
      getBezierPath,
    } from '@xyflow/react';

    const h = React.createElement;

    const COLORS = {
      ideas: '#34d399',
      tensions: '#f472b6',
      signals: '#38bdf8',
      strategy: '#a78bfa',
      frameworks: '#fb923c',
    };

    function ZoneNode({ data }) {
      const color = COLORS[data.zoneType] || '#555';
      return h('div', {
        className: 'zone-premium',
        style: {
          width: '100%', height: '100%',
          border: `1px solid ${color}22`,
          background: `${color}04`,
        }
      },
        h('div', { className: 'zone-premium-label', style: { color } }, data.label),
        h('div', { className: 'zone-premium-meta' },
          data.cardCount && `${data.cardCount} cards`,
        ),
      );
    }

    function CardNode({ data }) {
      const color = COLORS[data.cardType] || '#555';
      let cls = 'card-translucent';
      if (data.isLocked) cls += ' locked';
      else if (data.isSelected) cls += ' selected';
      if (data.isRejected) cls += ' rejected';

      return h('div', { className: cls },
        h('div', { className: 'type-bar', style: { background: color } }),
        h('div', null, data.text),
        data.isLocked && h('span', { style: { position: 'absolute', top: '4px', right: '6px', fontSize: '9px', color: '#c99dd6' } }, '🔒'),
        h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0, width: 6, height: 6 } }),
        h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0, width: 6, height: 6 } }),
      );
    }

    function SummaryNode({ data }) {
      return h('div', { className: 'summary-premium', style: { width: data.width || 'auto' } },
        h('div', { className: 'label' }, '✦ Summary'),
        h('div', null, data.text),
        h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0, width: 6, height: 6 } }),
        h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0, width: 6, height: 6 } }),
      );
    }

    function RiffNode({ data }) {
      return h('div', { className: 'riff-card-premium' },
        h('div', { className: 'riff-badge-sm' }, '↻ riff'),
        h('div', null, data.text),
        h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0, width: 6, height: 6 } }),
        h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0, width: 6, height: 6 } }),
      );
    }

    function CollapsedNode({ data }) {
      const color = COLORS[data.zoneType] || '#555';
      return h('div', { className: 'collapsed-premium' },
        h('div', { className: 'collapsed-edge', style: { background: color } }),
        h('span', { className: 'collapsed-text' }, data.label),
        h('span', { className: 'collapsed-preview' }, data.summaryPreview),
        h('span', { className: 'collapsed-count' }, `${data.cardCount}`),
      );
    }

    function RiffEdge({ sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition, data }) {
      const [edgePath] = getBezierPath({ sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition });
      return h('g', null,
        h('path', {
          d: edgePath,
          fill: 'none',
          stroke: 'rgba(234,193,245,0.3)',
          strokeWidth: 1.5,
          strokeDasharray: '6 4',
          style: { animation: 'dashOffset 1.8s linear infinite' },
        })
      );
    }

    function CrossZoneEdge({ sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition }) {
      const [edgePath] = getBezierPath({ sourceX, sourceY, targetX, targetY, sourcePosition, targetPosition });
      return h('g', null,
        h('path', {
          d: edgePath,
          fill: 'none',
          stroke: 'rgba(255,255,255,0.06)',
          strokeWidth: 1,
        })
      );
    }

    const nodeTypes = { zone: ZoneNode, card: CardNode, summary: SummaryNode, riff: RiffNode, collapsed: CollapsedNode };
    const edgeTypes = { riff: RiffEdge, crosszone: CrossZoneEdge };

    const initialNodes = [
      // Parent zone: Campaign Sprint
      {
        id: 'parent-sprint',
        type: 'zone',
        position: { x: 40, y: 80 },
        data: { label: 'Campaign Sprint', zoneType: 'strategy', cardCount: null },
        style: { width: 800, height: 480 },
      },
      // Child zone: Tensions
      {
        id: 'child-tensions',
        type: 'zone',
        position: { x: 15, y: 25 },
        parentId: 'parent-sprint',
        extent: 'parent',
        data: { label: 'Tensions', zoneType: 'tensions', cardCount: 3 },
        style: { width: 370, height: 410 },
      },
      ...['Authenticity demands conflict with scale requirements',
          'Heritage positioning alienates younger demographics',
          'Sustainability claims need substantiation audiences trust'
      ].map((t, i) => ({
        id: `ct-${i}`,
        type: 'card',
        position: { x: 14, y: 22 + i * 115 },
        parentId: 'child-tensions',
        extent: 'parent',
        data: { text: t, cardType: 'tensions', isSelected: i === 0, isLocked: i === 2 },
      })),

      // Child zone: Ideas
      {
        id: 'child-ideas',
        type: 'zone',
        position: { x: 410, y: 25 },
        parentId: 'parent-sprint',
        extent: 'parent',
        data: { label: 'Ideas', zoneType: 'ideas', cardCount: 3 },
        style: { width: 370, height: 410 },
      },
      ...['Community co-creation model with transparent feedback loops',
          'Physical spaces as cultural platforms not retail stores',
          'Rotating maker residency programme in flagship locations'
      ].map((t, i) => ({
        id: `ci-${i}`,
        type: 'card',
        position: { x: 14, y: 22 + i * 115 },
        parentId: 'child-ideas',
        extent: 'parent',
        data: { text: t, cardType: 'ideas', isLocked: i === 0, isSelected: i === 1 },
      })),

      // Riff from card ci-2
      {
        id: 'riff-1',
        type: 'riff',
        position: { x: 200, y: 265 },
        parentId: 'child-ideas',
        extent: 'parent',
        data: { text: 'Artist-in-residence revenue share with community benefit fund' },
      },

      // Standalone zone: Signals
      {
        id: 'zone-signals',
        type: 'zone',
        position: { x: 900, y: 80 },
        data: { label: 'Signals', zoneType: 'signals', cardCount: 3 },
        style: { width: 420, height: 340 },
      },
      ...['Gen Z luxury buyers 73% check brand values before purchase',
          'Resale market growing 3x faster than new in key categories',
          'Community commerce retention 5x higher than traditional retail'
      ].map((t, i) => ({
        id: `cs-${i}`,
        type: 'card',
        position: { x: 14, y: 22 + i * 100 },
        parentId: 'zone-signals',
        extent: 'parent',
        data: { text: t, cardType: 'signals', isSelected: i === 0 || i === 2 },
      })),

      // Convergence zone with board-level summary
      {
        id: 'zone-convergence',
        type: 'zone',
        position: { x: 900, y: 460 },
        data: { label: 'Convergence', zoneType: 'strategy', cardCount: 2 },
        style: { width: 420, height: 330 },
      },
      {
        id: 'board-summary',
        type: 'summary',
        position: { x: 14, y: 22 },
        parentId: 'zone-convergence',
        extent: 'parent',
        data: {
          text: 'Core direction: position as premium-accessible brand where community co-creation is the product development model. Physical spaces serve as cultural platforms. Heritage is expressed through craft values, not exclusivity.',
          width: 380,
        },
      },
      {
        id: 'conv-1',
        type: 'card',
        position: { x: 14, y: 180 },
        parentId: 'zone-convergence',
        extent: 'parent',
        data: { text: 'Community co-creation as core brand ritual and product engine', cardType: 'strategy', isLocked: true },
      },
      {
        id: 'conv-2',
        type: 'card',
        position: { x: 215, y: 180 },
        parentId: 'zone-convergence',
        extent: 'parent',
        data: { text: 'Physical spaces as cultural hubs anchoring digital community', cardType: 'strategy', isLocked: true },
      },

      // Collapsed zone: Frameworks
      {
        id: 'collapsed-fw',
        type: 'collapsed',
        position: { x: 40, y: 610 },
        data: {
          label: 'Frameworks',
          zoneType: 'frameworks',
          cardCount: 3,
          summaryPreview: 'Brand architecture model mapping community tiers to product access levels',
        },
        style: { width: 800, height: 48 },
      },

      // Summary Archive zone
      {
        id: 'zone-archive',
        type: 'zone',
        position: { x: 40, y: 700 },
        data: { label: 'Summary Archive', zoneType: 'strategy', cardCount: 0 },
        style: { width: 400, height: 150 },
      },
    ];

    const initialEdges = [
      // Riff edge
      { id: 'e-riff', source: 'ci-2', target: 'riff-1', type: 'riff' },
      // Cross-zone edges
      { id: 'e-cross-1', source: 'ct-0', target: 'ci-0', type: 'crosszone' },
      { id: 'e-cross-2', source: 'cs-2', target: 'conv-1', type: 'crosszone' },
    ];

    function App() {
      const [nodes, , onNodesChange] = useNodesState(initialNodes);
      const [edges, , onEdgesChange] = useEdgesState(initialEdges);
      const [showPalette, setShowPalette] = useState(false);
      const [tool, setTool] = useState('select');

      return h('div', { style: { width: '100vw', height: '100vh' } },
        h('div', { className: 'top-bar-premium' },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
            h('span', { className: 'syne', style: { fontWeight: 600, fontSize: '14px' } }, 'Brand Strategy Sprint'),
            h('span', { style: { fontSize: '11px', color: '#444' } }, '7 zones · 17 cards · 1 summary'),
          ),
          h('button', {
            style: {
              background: 'rgba(255,255,255,0.04)',
              border: '1px solid rgba(255,255,255,0.06)',
              borderRadius: '8px',
              padding: '5px 12px',
              color: '#888',
              fontSize: '11px',
              cursor: 'pointer',
              fontFamily: 'Inter, sans-serif',
            },
            onClick: () => setShowPalette(!showPalette),
          }, '⌘K'),
        ),

        h(ReactFlow, {
          nodes, edges, onNodesChange, onEdgesChange,
          nodeTypes,
          edgeTypes,
          fitView: true,
          fitViewOptions: { padding: 0.15 },
          style: { background: '#0d0d11' },
          proOptions: { hideAttribution: true },
        },
          h(Background, { gap: 24, size: 1, color: 'rgba(255,255,255,0.015)' }),
          h(Controls, { showInteractive: false }),
          h(MiniMap, {
            nodeColor: (n) => COLORS[n.data?.zoneType] || '#222',
          }),
        ),

        // Command palette
        showPalette && h('div', { className: 'command-palette' },
          h('input', { className: 'cmd-input', placeholder: 'Type a command...', autoFocus: true }),
          h('div', { className: 'cmd-divider' }),
          [
            { icon: '+', label: 'New zone', shortcut: 'N' },
            { icon: '✦', label: 'Summarize all', shortcut: 'S' },
            { icon: '→', label: 'Generate in focus zone', shortcut: 'G' },
            { icon: '↓', label: 'Export board', shortcut: 'E' },
            { icon: '−', label: 'Collapse all zones', shortcut: 'C' },
          ].map(cmd =>
            h('div', { key: cmd.label, className: 'cmd-item' },
              h('span', { className: 'icon' }, cmd.icon),
              h('span', null, cmd.label),
              h('span', { className: 'cmd-shortcut' }, cmd.shortcut),
            )
          ),
        ),

        // Bottom toolbar
        h('div', { className: 'bottom-toolbar' },
          ['Select', 'Zone', 'Connect', 'Generate'].map(t =>
            h('button', {
              key: t,
              className: tool === t.toLowerCase() ? 'active' : '',
              onClick: () => setTool(t.toLowerCase()),
            }, t)
          ),
        ),
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
