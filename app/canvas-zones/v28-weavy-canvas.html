<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V28 Weavy Canvas</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c14;
      --surface: rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.16);
      --text-primary: #e2e2f0;
      --text-secondary: rgba(200,200,220,0.6);
      --text-muted: rgba(200,200,220,0.3);
      --purple: #7c3aed;
      --blue: #3b82f6;
      --green: #10b981;
      --teal: #06b6d4;
      --pink: #ec4899;
      --rose: #f43f5e;
      --grad-purple: linear-gradient(135deg, #7c3aed, #3b82f6);
      --grad-green: linear-gradient(135deg, #10b981, #06b6d4);
      --grad-pink: linear-gradient(135deg, #ec4899, #f43f5e);
      --grad-blue: linear-gradient(135deg, #3b82f6, #06b6d4);
      --glow-purple: 0 0 20px rgba(124,58,237,0.2);
      --glow-green: 0 0 20px rgba(16,185,129,0.2);
      --glow-pink: 0 0 20px rgba(236,72,153,0.2);
      --glow-blue: 0 0 20px rgba(59,130,246,0.2);
    }

    html, body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }

    /* ── TOP BAR ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(12,12,20,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 300;
    }

    #seeds-logo {
      height: 18px;
      width: auto;
      flex-shrink: 0;
    }

    .top-separator {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 2px;
    }

    #project-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      -webkit-background-clip: unset;
      -webkit-text-fill-color: unset;
      padding: 4px 8px;
      border-radius: 8px;
    }
    #project-name:hover {
      background: var(--grad-purple);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .top-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-indicators {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      position: relative;
    }
    .status-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      opacity: 0.3;
    }
    .status-dot.green { background: linear-gradient(135deg, #10b981, #06b6d4); }
    .status-dot.green::after { background: #10b981; }
    .status-dot.purple { background: linear-gradient(135deg, #7c3aed, #3b82f6); }
    .status-dot.purple::after { background: #7c3aed; }

    #share-btn {
      background: var(--grad-purple);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: -0.01em;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.3), var(--glow-purple);
    }
    #share-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px rgba(124,58,237,0.5), 0 0 30px rgba(124,58,237,0.35);
    }

    /* ── CANVAS ── */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: default;
      background:
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(80,50,180,0.06) 0%, transparent 70%),
        var(--bg);
    }
    #canvas-container.panning { cursor: grab; }
    #canvas-container.panning:active { cursor: grabbing; }

    /* Dot grid via SVG background */
    #canvas-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
      z-index: 0;
    }

    #canvas-world {
      position: absolute;
      width: 6000px;
      height: 5000px;
      transform-origin: 0 0;
    }

    /* ── LEFT TOOLBAR ── */
    #left-toolbar {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 10px 8px;
      background: rgba(12,12,20,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), var(--glow-purple);
    }

    .toolbar-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .toolbar-btn:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }
    .toolbar-btn.active {
      background: rgba(124,58,237,0.15);
      color: #a78bfa;
      box-shadow: 0 0 12px rgba(124,58,237,0.2);
    }
    .toolbar-btn.active-green {
      background: rgba(16,185,129,0.12);
      color: #34d399;
      box-shadow: 0 0 12px rgba(16,185,129,0.2);
    }
    .toolbar-btn.active-pink {
      background: rgba(236,72,153,0.12);
      color: #f472b6;
      box-shadow: 0 0 12px rgba(236,72,153,0.2);
    }
    .toolbar-btn.active-blue {
      background: rgba(59,130,246,0.12);
      color: #60a5fa;
      box-shadow: 0 0 12px rgba(59,130,246,0.2);
    }

    /* Tooltip */
    .toolbar-btn::after {
      content: attr(data-tip);
      position: absolute;
      left: calc(100% + 10px);
      top: 50%;
      transform: translateY(-50%);
      background: rgba(20,20,35,0.95);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 999;
    }
    .toolbar-btn:hover::after { opacity: 1; }

    .toolbar-divider {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* Gradient icon colors */
    .icon-green { color: #34d399; }
    .icon-pink { color: #f472b6; }
    .icon-blue { color: #60a5fa; }
    .icon-purple { color: #a78bfa; }

    /* ── BOTTOM TOOLBAR ── */
    #bottom-toolbar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }

    #new-block-trigger {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(12,12,20,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      border: 1px solid rgba(124,58,237,0.3);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,58,237,0.1);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    #new-block-trigger::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--grad-purple);
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: 999px;
    }

    #new-block-trigger:hover::before { opacity: 0.08; }
    #new-block-trigger:hover {
      border-color: rgba(124,58,237,0.6);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4), var(--glow-purple);
      transform: translateY(-1px);
    }

    #new-block-trigger .plus-icon {
      width: 20px; height: 20px;
      border-radius: 6px;
      background: var(--grad-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 400;
      color: #fff;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    #new-block-trigger span { position: relative; z-index: 1; }

    #block-menu {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(12,12,20,0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 200px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    #block-menu.open {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }

    .block-menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border: none;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      width: 100%;
      text-align: left;
    }
    .block-menu-item:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
    }
    .block-menu-item:hover .bmi-icon { opacity: 1; transform: scale(1.1); }

    .bmi-icon {
      width: 28px; height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      opacity: 0.85;
      transition: all 0.15s;
    }
    .bmi-icon.green { background: rgba(16,185,129,0.15); color: #34d399; }
    .bmi-icon.pink { background: rgba(236,72,153,0.15); color: #f472b6; }
    .bmi-icon.blue { background: rgba(59,130,246,0.15); color: #60a5fa; }
    .bmi-icon.purple { background: rgba(124,58,237,0.15); color: #a78bfa; }

    /* ── ZONES ── */
    .zone {
      position: absolute;
      border-radius: 20px;
      z-index: 2;
      transition: box-shadow 0.3s;
    }

    .zone-body {
      position: relative;
      width: 100%; height: 100%;
      border-radius: 20px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: visible;
    }

    /* Animated gradient border via pseudo element */
    .zone::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 21px;
      padding: 1px;
      background: var(--zone-border-grad, rgba(255,255,255,0.08));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.6;
      transition: opacity 0.3s;
    }
    .zone:hover::before { opacity: 1; }
    .zone:hover { box-shadow: var(--zone-glow, none); }

    .zone-ideas { --zone-border-grad: linear-gradient(135deg, rgba(16,185,129,0.4), rgba(6,182,212,0.3)); --zone-glow: 0 0 40px rgba(16,185,129,0.08); }
    .zone-tensions { --zone-border-grad: linear-gradient(135deg, rgba(236,72,153,0.4), rgba(244,63,94,0.3)); --zone-glow: 0 0 40px rgba(236,72,153,0.08); }
    .zone-signals { --zone-border-grad: linear-gradient(135deg, rgba(59,130,246,0.4), rgba(6,182,212,0.3)); --zone-glow: 0 0 40px rgba(59,130,246,0.08); }

    .zone-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
      border-radius: 20px 20px 0 0;
    }

    .zone-bar {
      width: 3px;
      height: 18px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .zone-bar.green { background: linear-gradient(180deg, #10b981, #06b6d4); }
    .zone-bar.pink { background: linear-gradient(180deg, #ec4899, #f43f5e); }
    .zone-bar.blue { background: linear-gradient(180deg, #3b82f6, #06b6d4); }

    .zone-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .zone-label.green {
      background: var(--grad-green);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .zone-label.pink {
      background: var(--grad-pink);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .zone-label.blue {
      background: var(--grad-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .zone-count-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 999px;
    }
    .zone-count-badge.green {
      background: rgba(16,185,129,0.12);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.2);
    }
    .zone-count-badge.pink {
      background: rgba(236,72,153,0.12);
      color: #f472b6;
      border: 1px solid rgba(236,72,153,0.2);
    }
    .zone-count-badge.blue {
      background: rgba(59,130,246,0.12);
      color: #60a5fa;
      border: 1px solid rgba(59,130,246,0.2);
    }

    .zone-content {
      position: absolute;
      top: 50px;
      left: 0; right: 0; bottom: 0;
      padding: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
    }

    /* ── SUMMARY CARD (AI) ── */
    .summary-card {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 4px;
      transition: all 0.2s;
    }
    .summary-card:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.12);
    }
    .summary-card-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .ai-sparkle {
      width: 20px; height: 20px;
      border-radius: 6px;
      background: var(--grad-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }
    .summary-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--grad-purple);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .summary-text {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* ── CARDS ── */
    .card {
      position: absolute;
      width: 180px;
      height: 130px;
      border-radius: 16px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      cursor: grab;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      z-index: 10;
      overflow: hidden;
      user-select: none;
    }
    .card:hover {
      border-color: rgba(255,255,255,0.14);
      transform: translateY(-2px) scale(1.01);
      z-index: 20;
    }
    .card.dragging {
      cursor: grabbing;
      z-index: 100;
      transform: rotate(1.5deg) scale(1.02);
    }
    .card.selected {
      box-shadow: 0 0 0 2px #7c3aed, var(--glow-purple);
    }

    /* Type-specific card hover glow */
    .card.idea:hover { box-shadow: var(--glow-green); }
    .card.tension:hover { box-shadow: var(--glow-pink); }
    .card.signal:hover { box-shadow: var(--glow-blue); }

    .card-bar {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 16px 0 0 16px;
    }
    .card-bar.green { background: linear-gradient(180deg, #10b981, #06b6d4); }
    .card-bar.pink { background: linear-gradient(180deg, #ec4899, #f43f5e); }
    .card-bar.blue { background: linear-gradient(180deg, #3b82f6, #06b6d4); }
    .card-bar.purple { background: linear-gradient(180deg, #7c3aed, #3b82f6); }

    .card-inner {
      padding: 10px 10px 10px 16px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .card-type {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-type.green {
      background: var(--grad-green);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-type.pink {
      background: var(--grad-pink);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-type.blue {
      background: var(--grad-blue);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-type.purple {
      background: var(--grad-purple);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .card-text {
      font-size: 12px;
      font-weight: 400;
      color: #c0c0d0;
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Card action buttons */
    .card-actions {
      position: absolute;
      bottom: 8px;
      right: 8px;
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .card:hover .card-actions { opacity: 1; }

    .card-action-btn {
      width: 24px; height: 24px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(12,12,20,0.85);
      backdrop-filter: blur(8px);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      line-height: 1;
    }
    .card-action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
    .card-action-btn.reject:hover { background: rgba(244,63,94,0.2); color: #f43f5e; border-color: rgba(244,63,94,0.3); }
    .card-action-btn.star:hover { background: rgba(251,191,36,0.15); color: #fbbf24; border-color: rgba(251,191,36,0.3); }
    .card-action-btn.riff:hover { background: rgba(124,58,237,0.2); color: #a78bfa; border-color: rgba(124,58,237,0.3); }

    /* ── ZOOM CONTROLS ── */
    #zoom-controls {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 200;
      background: rgba(12,12,20,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }
    .zoom-btn {
      width: 32px; height: 32px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-family: 'DM Sans', sans-serif;
    }
    .zoom-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
    #zoom-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      padding: 2px 0;
      letter-spacing: 0.02em;
    }

    /* Mini map hint */

03 0H727.933ZM494.46 31.1436C489.269 31.1436 486.674 33.7389 486.674 38.6699V132.618C486.674 137.549 489.269 140.145 494.46 140.145H541.175C546.365 140.144 548.96 137.549 548.96 132.618V38.6699C548.96 33.7391 546.365 31.1437 541.175 31.1436H494.46Z" fill="white"/>

  <!-- ZOOM CONTROLS -->
  <div id="zoom-controls">
    <button class="zoom-btn" onclick="adjustZoom(0.15)">+</button>

    <button class="zoom-btn" onclick="adjustZoom(-0.15)">−</button>
  </div>

  <div id="canvas-hint">Space + drag to pan · Scroll to zoom</div>

  <script>
    // ── STATE ──
    let scale = 1;
    let panX = 0, panY = 0;
    let isPanning = false;
    let panStart = { x: 0, y: 0 };
    let currentTool = 'select';
    let blockMenuOpen = false;
    let spaceDown = false;

    // Card drag state
    let dragCard = null;
    let dragOffX = 0, dragOffY = 0;

    const container = document.getElementById('canvas-container');
    const world = document.getElementById('canvas-world');

    // ── DATA ──
    const ideas = [
      { id: 'i1', text: 'Launch a creator co-creation campaign — invite micro-influencers to remix brand stories with authentic UGC', type: 'idea', color: 'green', x: 20, y: 70 },
      { id: 'i2', text: 'Interactive brand quiz that surfaces the right product tier based on customer values, not demographics', type: 'idea', color: 'green', x: 216, y: 70 },
      { id: 'i3', text: 'Seasonal "behind the scenes" series showing the craft and sourcing story — premium transparency play', type: 'idea', color: 'green', x: 412, y: 70 },
      { id: 'i4', text: 'Referral program built around shared values and mission alignment — beyond transactional discounts', type: 'idea', color: 'green', x: 20, y: 218 },
      { id: 'i5', text: 'Live workshop series: position the brand as a knowledge hub for our core audience segment', type: 'idea', color: 'green', x: 216, y: 218 },
      { id: 'i6', text: 'Partner with complementary brands on a curated bundle — differentiate through curation, not just price', type: 'idea', color: 'green', x: 412, y: 218 },
    ];

    const tensions = [
      { id: 't1', text: 'Premium positioning vs. accessibility: how do we speak to aspiration without alienating price-sensitive loyalists?', type: 'tension', color: 'pink', x: 20, y: 70 },
      { id: 't2', text: 'Authenticity vs. production value: audiences want rawness but expect polish — where is the line for this brand?', type: 'tension', color: 'pink', x: 216, y: 70 },
      { id: 't3', text: 'Growth velocity vs. brand coherence: fast scaling risks diluting the story that earned trust in the first place', type: 'tension', color: 'pink', x: 20, y: 218 },
      { id: 't4', text: 'Community depth vs. broad reach: deep niche loyalty vs. widening the funnel — both can\'t be primary', type: 'tension', color: 'pink', x: 216, y: 218 },
    ];

    const signals = [
      { id: 's1', text: 'Search data: "ethical alternatives" +180% YoY in category; audience actively seeking mission-aligned brands', type: 'signal', color: 'blue', x: 20, y: 70 },
      { id: 's2', text: 'Competitor gap: no major player in segment owns the "craft + convenience" positioning — white space confirmed', type: 'signal', color: 'blue', x: 216, y: 70 },
      { id: 's3', text: 'Social listening: brand mentions spike when founders speak publicly — personal narrative drives discovery', type: 'signal', color: 'blue', x: 20, y: 218 },
    ];

    const zones = [
      {
        id: 'zone-ideas',
        label: 'Campaign Ideas',
        color: 'green',
        x: 160, y: 80,
        w: 640, h: 430,
        cards: ideas,
        summary: 'Six ideas across creator-led campaigns, interactive experiences, and partnership plays. Co-creation and values-alignment are the common threads.',
        cssClass: 'zone-ideas',
      },
      {
        id: 'zone-tensions',
        label: 'Audience Tensions',
        color: 'pink',
        x: 860, y: 80,
        w: 470, h: 430,
        cards: tensions,
        summary: 'Premium vs. access and authenticity vs. polish are the central fault lines. Resolving these will define the brand voice framework.',
        cssClass: 'zone-tensions',
      },
      {
        id: 'zone-signals',
        label: 'Market Signals',
        color: 'blue',
        x: 1390, y: 80,
        w: 470, h: 430,
        cards: signals,
        summary: 'Strong white space signal in craft + convenience positioning. Founder voice and mission-led narrative are active discovery drivers.',
        cssClass: 'zone-signals',
      },
    ];

    // ── BUILD ZONES ──
    function buildZones() {
      zones.forEach(zone => {
        const el = document.createElement('div');
        el.className = `zone ${zone.cssClass}`;
        el.id = zone.id;
        el.style.left = zone.x + 'px';
        el.style.top = zone.y + 'px';
        el.style.width = zone.w + 'px';
        el.style.height = zone.h + 'px';

        el.innerHTML = `
          <div class="zone-body">
            <div class="zone-header">
              <div class="zone-bar ${zone.color}"></div>
              <span class="zone-label ${zone.color}">${zone.label}</span>
              <span class="zone-count-badge ${zone.color}">${zone.cards.length}</span>
            </div>
            <div class="zone-content" id="${zone.id}-content">
              <div class="summary-card">
                <div class="summary-card-head">
                  <div class="ai-sparkle">✦</div>
                  <span class="summary-title">AI Summary</span>
                </div>
                <p class="summary-text">${zone.summary}</p>
              </div>
            </div>
          </div>
        `;
        world.appendChild(el);

        // Place cards inside zones
        zone.cards.forEach(card => {
          const cardEl = buildCard(card);
          cardEl.style.left = (zone.x + card.x + 8) + 'px';
          cardEl.style.top = (zone.y + 50 + card.y + 80) + 'px';
          world.appendChild(cardEl);
        });
      });

      // A few free-floating direction cards
      const dirCards = [
        { id: 'd1', text: 'North Star: own the "values-first" positioning in a category that defaults to price signals', type: 'direction', color: 'purple', x: 1390, y: 580 },
        { id: 'd2', text: 'Q3 priority: resolve the authenticity tension through founder content series — test in 6 weeks', type: 'direction', color: 'purple', x: 1590, y: 580 },
      ];
      dirCards.forEach(card => {
        const cardEl = buildCard(card);
        cardEl.style.left = card.x + 'px';
        cardEl.style.top = card.y + 'px';
        world.appendChild(cardEl);
      });
    }

    function buildCard(data) {
      const el = document.createElement('div');
      el.className = `card ${data.type}`;
      el.id = data.id;
      el.dataset.id = data.id;
      el.innerHTML = `
        <div class="card-bar ${data.color}"></div>
        <div class="card-inner">
          <div class="card-type ${data.color}">${data.type}</div>
          <div class="card-text">${data.text}</div>
        </div>
        <div class="card-actions">
          <button class="card-action-btn reject" title="Dismiss" onclick="event.stopPropagation()">✕</button>
          <button class="card-action-btn star" title="Star" onclick="event.stopPropagation()">★</button>
          <button class="card-action-btn riff" title="Riff" onclick="event.stopPropagation()">↻</button>
        </div>
      `;
      setupCardDrag(el);
      return el;
    }

    // ── CARD DRAG ──
    function setupCardDrag(el) {
      el.addEventListener('mousedown', e => {
        if (e.button !== 0) return;
        if (e.target.closest('.card-action-btn')) return;
        if (currentTool === 'pan' || spaceDown) return;
        e.stopPropagation();

        dragCard = el;
        const rect = el.getBoundingClientRect();
        dragOffX = e.clientX - rect.left;
        dragOffY = e.clientY - rect.top;

        el.classList.add('dragging');
        el.style.zIndex = 100;
      });
    }

    document.addEventListener('mousemove', e => {
      if (dragCard) {
        const containerRect = container.getBoundingClientRect();
        const x = (e.clientX - containerRect.left - panX - dragOffX) / scale;
        const y = (e.clientY - containerRect.top - panY - dragOffY) / scale;
        dragCard.style.left = x + 'px';
        dragCard.style.top = y + 'px';
        return;
      }

      if (isPanning) {
        panX = e.clientX - panStart.x;
        panY = e.clientY - panStart.y;
        applyTransform();
      }
    });

    document.addEventListener('mouseup', e => {
      if (dragCard) {
        dragCard.classList.remove('dragging');
        dragCard.style.zIndex = '';
        dragCard = null;
      }
      if (isPanning) {
        isPanning = false;
        updateCursor();
      }
    });

    // ── PAN ──
    container.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (e.target.closest('.card') || e.target.closest('.zone-header') || e.target.closest('.summary-card')) return;
      if (currentTool === 'pan' || spaceDown) {
        isPanning = true;
        panStart.x = e.clientX - panX;
        panStart.y = e.clientY - panY;
        updateCursor();
        e.preventDefault();
      }
    });

    // ── ZOOM ──
    container.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const newScale = Math.max(0.2, Math.min(3, scale + delta));
      const scaleChange = newScale / scale;

      panX = mouseX - scaleChange * (mouseX - panX);
      panY = mouseY - scaleChange * (mouseY - panY);
      scale = newScale;

      applyTransform();
      updateZoomLabel();
    }, { passive: false });

    function adjustZoom(delta) {
      const containerRect = container.getBoundingClientRect();
      const cx = containerRect.width / 2;
      const cy = containerRect.height / 2;
      const newScale = Math.max(0.2, Math.min(3, scale + delta));
      const scaleChange = newScale / scale;
      panX = cx - scaleChange * (cx - panX);
      panY = cy - scaleChange * (cy - panY);
      scale = newScale;
      applyTransform();
      updateZoomLabel();
    }

    function applyTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function updateZoomLabel() {
      document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
    }

    // ── SPACEBAR PAN ──
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' && !e.repeat) {
        spaceDown = true;
        updateCursor();
        e.preventDefault();
      }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space') {
        spaceDown = false;
        updateCursor();
      }
    });

    function updateCursor() {
      if (currentTool === 'pan' || spaceDown) {
        container.classList.add('panning');
      } else {
        container.classList.remove('panning');
      }
    }

    // ── TOOL SWITCHING ──
    function setTool(tool, btn) {
      currentTool = tool;
      document.querySelectorAll('.toolbar-btn').forEach(b => {
        b.classList.remove('active', 'active-green', 'active-pink', 'active-blue', 'active-purple');
      });
      const classMap = { select: 'active', pan: 'active', idea: 'active-green', tension: 'active-pink', signal: 'active-blue', direction: 'active-purple' };
      btn.classList.add(classMap[tool] || 'active');
      updateCursor();
    }

    // ── BLOCK MENU ──
    function toggleBlockMenu() {
      blockMenuOpen = !blockMenuOpen;
      document.getElementById('block-menu').classList.toggle('open', blockMenuOpen);
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('#bottom-toolbar')) {
        blockMenuOpen = false;
        document.getElementById('block-menu').classList.remove('open');
      }
    });

    let newCardCounter = 100;
    function addBlock(type) {
      const colorMap = { idea: 'green', tension: 'pink', signal: 'blue', direction: 'purple' };
      const textMap = {
        idea: 'New idea — click to edit',
        tension: 'New tension — click to edit',
        signal: 'New signal — click to edit',
        direction: 'New direction — click to edit',
      };
      const containerRect = container.getBoundingClientRect();
      const cx = (containerRect.width / 2 - panX) / scale;
      const cy = (containerRect.height / 2 - panY) / scale;

      const card = {
        id: 'new-' + (++newCardCounter),
        text: textMap[type],
        type,
        color: colorMap[type],
      };
      const el = buildCard(card);
      el.style.left = (cx - 90) + 'px';
      el.style.top = (cy - 65) + 'px';
      world.appendChild(el);

      blockMenuOpen = false;
      document.getElementById('block-menu').classList.remove('open');
    }

    // ── INIT ──
    buildZones();

    // Center view initially
    panX = 120;
    panY = 60;
    scale = 0.85;
    applyTransform();
    updateZoomLabel();
  </script>
</body>
</html>
