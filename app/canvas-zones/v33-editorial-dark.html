<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seeds — V33 Editorial Dark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #1a1a1a;
  color: #e0e0e0;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ── TOP BAR ── */
#topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: #1a1a1a;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  z-index: 100;
}

#topbar-logo { display: flex; align-items: center; flex-shrink: 0; }

#topbar-sep {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.08);
  flex-shrink: 0;
}

#topbar-title {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: #e0e0e0;
  letter-spacing: -0.01em;
  flex: 1;
}

#topbar-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.kbd-pill {
  font-size: 11px;
  color: #555;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 5px;
  padding: 3px 8px;
  cursor: pointer;
  transition: all 150ms ease;
  font-family: 'Inter', system-ui, sans-serif;
}
.kbd-pill:hover { color: #888; border-color: rgba(255,255,255,0.14); }

.topbar-meta {
  font-size: 12px;
  color: #555;
  letter-spacing: -0.01em;
}

.share-btn {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: #e0e0e0;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 150ms ease;
  letter-spacing: 0.01em;
}
.share-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); }

/* ── CANVAS ── */
#canvas-wrap {
  position: fixed;
  top: 48px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  cursor: default;
  background-color: #1a1a1a;
  background-image: radial-gradient(circle, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
}
#canvas-wrap.panning { cursor: grabbing; }
#canvas-wrap.hand-mode { cursor: grab; }
#canvas-wrap.hand-mode.panning { cursor: grabbing; }

#canvas-inner {
  position: absolute;
  width: 6000px;
  height: 5000px;
  transform-origin: 0 0;
}

/* ── ZONES ── */
.zone {
  position: absolute;
  border-radius: 12px;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.08);
  border-top-width: 2px;
  z-index: 2;
  min-width: 300px;
  min-height: 200px;
}

.zone-label {
  position: absolute;
  top: 14px;
  left: 16px;
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  white-space: nowrap;
  pointer-events: none;
  user-select: none;
}

.zone-card-count {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 11px;
  color: #555;
  font-family: 'Inter', system-ui, sans-serif;
}

/* Zone resize handles */
.zone-resize {
  position: absolute;
  z-index: 5;
  opacity: 0;
  transition: opacity 150ms ease;
}
.zone:hover .zone-resize { opacity: 1; }

.zone-resize-r {
  right: -3px; top: 12px; bottom: 12px; width: 6px;
  cursor: ew-resize;
}
.zone-resize-b {
  bottom: -3px; left: 12px; right: 12px; height: 6px;
  cursor: ns-resize;
}
.zone-resize-br {
  right: -3px; bottom: -3px; width: 14px; height: 14px;
  cursor: nwse-resize;
  border-radius: 0 0 12px 0;
}
.zone-resize-br::after {
  content: '';
  position: absolute;
  right: 4px; bottom: 4px;
  width: 8px; height: 8px;
  border-right: 2px solid rgba(255,255,255,0.15);
  border-bottom: 2px solid rgba(255,255,255,0.15);
  border-radius: 0 0 2px 0;
}

/* Zone AI summaries */
.zone-summary {
  position: absolute;
  bottom: 14px;
  right: 14px;
  width: 200px;
  background: #2e2e2e;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 12px;
  z-index: 3;
}

.zone-summary-icon {
  font-size: 11px;
  color: #a78bfa;
  margin-right: 4px;
}

.zone-summary-label {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 10px;
  font-weight: 600;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}

.zone-summary-text {
  font-size: 12px;
  color: #888;
  line-height: 1.55;
}

/* ── CARDS ── */
.card {
  position: absolute;
  width: 180px;
  height: 130px;
  background: #2a2a2a;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  border-left: 3px solid transparent;
  overflow: hidden;
  cursor: grab;
  transition: border-color 150ms ease, box-shadow 200ms ease;
  display: flex;
  flex-direction: column;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.card:active { cursor: grabbing; }
.card:hover { border-color: rgba(255,255,255,0.12); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.card:hover .card-actions { opacity: 1; }

.card-content {
  padding: 12px 12px 8px 12px;
  display: flex;
  flex-direction: column;
  height: 100%;
}

.card-type-label {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  flex-shrink: 0;
}

.card-text {
  font-size: 12.5px;
  color: #ccc;
  line-height: 1.5;
  flex: 1;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
}

.card-actions {
  display: flex;
  align-items: center;
  gap: 0;
  opacity: 0;
  transition: opacity 150ms ease;
  flex-shrink: 0;
  padding: 0 8px 8px;
}

.card-action-btn {
  font-size: 12px;
  color: #555;
  background: transparent;
  border: none;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
  transition: color 150ms ease, background 150ms ease;
  line-height: 1;
}
.card-action-btn:hover { color: #ccc; background: rgba(255,255,255,0.06); }

/* Floating note */
.floating-note {
  position: absolute;
  width: 220px;
  background: #3a3520;
  border: 1px solid rgba(255,200,50,0.15);
  border-radius: 8px;
  padding: 14px;
  z-index: 10;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  transition: box-shadow 200ms ease;
}
.floating-note:active { cursor: grabbing; }
.floating-note:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
.floating-note-text {
  font-size: 12.5px;
  color: #e8d88a;
  line-height: 1.5;
  font-style: italic;
}

/* ── BOTTOM TOOLBAR ── */
#toolbar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1a1a1a;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 24px;
  padding: 0 6px;
  display: flex;
  align-items: center;
  gap: 2px;
  z-index: 100;
  height: 44px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.tool-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  background: transparent;
  border-radius: 10px;
  transition: all 150ms ease;
  position: relative;
  color: #666;
  font-size: 15px;
}
.tool-btn:hover { background: rgba(255,255,255,0.06); color: #aaa; }
.tool-btn.active { background: rgba(255,255,255,0.1); color: #e0e0e0; }

.tool-divider {
  width: 1px;
  height: 20px;
  background: rgba(255,255,255,0.06);
  margin: 0 4px;
  flex-shrink: 0;
}

.tool-label {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 500;
  color: #888;
  padding: 0 8px;
  white-space: nowrap;
}

#zoom-display {
  font-size: 11px;
  color: #555;
  padding: 0 6px;
  min-width: 36px;
  text-align: center;
  font-family: 'Inter', system-ui, sans-serif;
  user-select: none;
}

.new-block-btn {
  font-family: 'Instrument Sans', system-ui, sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #e0e0e0;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 150ms ease;
  white-space: nowrap;
  margin-left: 2px;
}
.new-block-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.18); }

/* Sticky palette dropdown */
.sticky-dropdown {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  background: #222;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 8px;
  display: none;
  gap: 6px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  z-index: 200;
}
.sticky-dropdown.open { display: flex; }
.sticky-color {
  width: 24px; height: 24px;
  border-radius: 6px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all 150ms ease;
}
.sticky-color:hover { transform: scale(1.15); }
.sticky-color.selected { border-color: #fff; }
</style>
</head>

      { text: 'Lead with UGC flywheel \u2014 seed 50 creators before any paid spend', x: 20, y: 40 },
      { text: 'Price anchoring through story \u2014 founder COGS transparency builds premium trust', x: 210, y: 40 },
      { text: 'TikTok Shop as primary launch channel \u2014 optimize for sub-$60 AOV entry', x: 400, y: 40 },
      { text: 'Q3 pop-up activation in 3 cities \u2014 NYC, LA, Chicago for earned media burst', x: 590, y: 40 },
    ],
    floatingNote: { text: 'Next step: align on $150k launch budget split across channels before EOW', x: 620, y: 210 }
  }
];

function createCard(text, type, x, y, parent) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.style.borderLeftColor = COLORS[type];

  const typeLabels = { idea: 'Idea', tension: 'Tension', signal: 'Signal', direction: 'Direction' };

  card.innerHTML = `
    <div class="card-content">
      <div class="card-type-label" style="color:${COLORS[type]}">${typeLabels[type]}</div>
      <div class="card-text">${text}</div>
    </div>
    <div class="card-actions">
      <button class="card-action-btn" title="Reject">\u2715</button>
      <button class="card-action-btn" title="Star">\u2605</button>
      <button class="card-action-btn" title="Riff">\u21bb</button>
    </div>
  `;

  // Card action handlers
  card.querySelectorAll('.card-action-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const action = btn.title;
      if (action === 'Reject') {
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        card.style.transition = 'all 200ms ease';
        setTimeout(() => card.remove(), 200);
      } else if (action === 'Star') {
        btn.style.color = btn.style.color === 'rgb(251, 191, 36)' ? '' : '#fbbf24';
      }
    });
  });

  // Card drag
  card.addEventListener('mousedown', e => {
    if (e.target.closest('.card-action-btn') || activeTool === 'hand') return;
    e.stopPropagation();
    dragCard = card;
    const rect = card.getBoundingClientRect();
    dragOffsetX = (e.clientX - rect.left) / scale;
    dragOffsetY = (e.clientY - rect.top) / scale;
    card.style.zIndex = 50;
    card.style.cursor = 'grabbing';
  });

  parent.appendChild(card);
  return card;
}

function createZone(zoneData) {
  const zone = document.createElement('div');
  zone.className = 'zone';
  zone.style.left = zoneData.x + 'px';
  zone.style.top = zoneData.y + 'px';
  zone.style.width = zoneData.w + 'px';
  zone.style.height = zoneData.h + 'px';
  zone.style.borderTopColor = COLORS[zoneData.type];
  zone.dataset.type = zoneData.type;

  const label = document.createElement('div');
  label.className = 'zone-label';
  label.style.color = COLORS[zoneData.type];
  label.textContent = zoneData.label;
  zone.appendChild(label);

  const count = document.createElement('div');
  count.className = 'zone-card-count';
  count.textContent = zoneData.cards.length + ' cards';
  zone.appendChild(count);

  // Cards
  zoneData.cards.forEach(c => createCard(c.text, zoneData.type, c.x, c.y, zone));

  // AI Summary
  if (zoneData.summary) {
    const summary = document.createElement('div');
    summary.className = 'zone-summary';
    summary.innerHTML = `
      <div class="zone-summary-label"><span class="zone-summary-icon">\u2726</span> AI Note</div>
      <div class="zone-summary-text">${zoneData.summary}</div>
    `;
    zone.appendChild(summary);
  }

  // Floating note
  if (zoneData.floatingNote) {
    const note = document.createElement('div');
    note.className = 'floating-note';
    note.style.left = zoneData.floatingNote.x + 'px';
    note.style.top = zoneData.floatingNote.y + 'px';
    note.innerHTML = `<div class="floating-note-text">${zoneData.floatingNote.text}</div>`;
    note.addEventListener('mousedown', e => {
      if (activeTool === 'hand') return;
      e.stopPropagation();
      dragCard = note;
      const rect = note.getBoundingClientRect();
      dragOffsetX = (e.clientX - rect.left) / scale;
      dragOffsetY = (e.clientY - rect.top) / scale;
      note.style.zIndex = 50;
      note.style.cursor = 'grabbing';
    });
    zone.appendChild(note);
  }

  // Resize handles
  ['r', 'b', 'br'].forEach(dir => {
    const handle = document.createElement('div');
    handle.className = `zone-resize zone-resize-${dir}`;
    handle.addEventListener('mousedown', e => {
      e.stopPropagation();
      resizingZone = zone;
      resizeType = dir;
      resizeStartX = e.clientX;
      resizeStartY = e.clientY;
      resizeStartW = zone.offsetWidth;
      resizeStartH = zone.offsetHeight;
    });
    zone.appendChild(handle);
  });

  inner.appendChild(zone);
}

// Build zones
zones.forEach(createZone);

// ── TOOL SWITCHING ──
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tool = btn.dataset.tool;
    if (!tool) return;

    // Toggle sticky dropdown
    if (tool === 'sticky') {
      stickyDropdown.classList.toggle('open');
    } else {
      stickyDropdown.classList.remove('open');
    }

    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTool = tool;
    wrap.classList.toggle('hand-mode', tool === 'hand');
    wrap.style.cursor = tool === 'hand' ? 'grab' : 'default';
  });
});

// Sticky color selection
document.querySelectorAll('.sticky-color').forEach(el => {
  el.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.sticky-color').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    stickyColor = el.dataset.color;
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable) return;
  const key = e.key.toLowerCase();
  if (key === 'v') { selectTool('select'); }
  else if (key === 'h') { selectTool('hand'); }
  else if (key === 'n') { selectTool('sticky'); }
  else if (key === 'c') { selectTool('connector'); }
  else if (key === 't') { selectTool('text'); }
  else if (key === 's') { selectTool('shape'); }
  else if (key === ' ') {
    e.preventDefault();
    if (!isPanning) {
      wrap.classList.add('hand-mode');
    }
  }
});

document.addEventListener('keyup', e => {
  if (e.key === ' ' && activeTool !== 'hand') {
    wrap.classList.remove('hand-mode');
  }
});

function selectTool(tool) {
  activeTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
  wrap.classList.toggle('hand-mode', tool === 'hand');
  wrap.style.cursor = tool === 'hand' ? 'grab' : 'default';
  if (tool !== 'sticky') stickyDropdown.classList.remove('open');
}

// ── PAN ──
wrap.addEventListener('mousedown', e => {
  if (dragCard || resizingZone) return;
  const shouldPan = activeTool === 'hand' || e.altKey || e.button === 1 || (e.button === 0 && e.target === wrap);
  if (shouldPan || (e.target === wrap || e.target === inner)) {
    if (activeTool === 'hand' || e.altKey || e.button === 1 || e.target === wrap || e.target === inner) {
      isPanning = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panOriginX = panX;
      panOriginY = panY;
      wrap.classList.add('panning');
      e.preventDefault();
    }
  }
});

document.addEventListener('mousemove', e => {
  // Zone resize
  if (resizingZone) {
    const dx = (e.clientX - resizeStartX) / scale;
    const dy = (e.clientY - resizeStartY) / scale;
    if (resizeType.includes('r')) {
      resizingZone.style.width = Math.max(300, resizeStartW + dx) + 'px';
    }
    if (resizeType.includes('b')) {
      resizingZone.style.height = Math.max(200, resizeStartH + dy) + 'px';
    }
    return;
  }

  // Card drag
  if (dragCard) {
    const cx = (e.clientX - panX) / scale;
    const cy = (e.clientY - panY - 48) / scale;
    dragCard.style.left = (cx - dragOffsetX) + 'px';
    dragCard.style.top = (cy - dragOffsetY) + 'px';
    return;
  }

  // Pan
  if (isPanning) {
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    updateTransform();
  }
});

document.addEventListener('mouseup', () => {
  if (dragCard) {
    dragCard.style.zIndex = 10;
    dragCard.style.cursor = 'grab';
    dragCard = null;
  }
  if (resizingZone) {
    resizingZone = null;
    resizeType = '';
  }
  if (isPanning) {
    isPanning = false;
    wrap.classList.remove('panning');
  }
});

// ── ZOOM ──
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.min(3, Math.max(0.15, scale * delta));
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * (newScale / scale);
  panY = my - (my - panY) * (newScale / scale);
  scale = newScale;
  updateTransform();
}, { passive: false });

// ── DOUBLE-CLICK TO SPAWN CARD ──
wrap.addEventListener('dblclick', e => {
  if (e.target.closest('.card') || e.target.closest('.floating-note') || e.target.closest('.zone-summary') || e.target.closest('.card-action-btn')) return;
  const cx = (e.clientX - panX) / scale;
  const cy = (e.clientY - panY - 48) / scale;

  const card = document.createElement('div');
  card.className = 'card';
  card.style.left = cx + 'px';
  card.style.top = cy + 'px';
  card.style.borderLeftColor = stickyColor;
  card.style.zIndex = 10;

  const typeForColor = Object.entries(COLORS).find(([, v]) => v === stickyColor);
  const typeName = typeForColor ? typeForColor[0].charAt(0).toUpperCase() + typeForColor[0].slice(1) : 'Note';

  card.innerHTML = `
    <div class="card-content">
      <div class="card-type-label" style="color:${stickyColor}">${typeName}</div>
      <div class="card-text" contenteditable="true" style="outline:none;cursor:text;" placeholder="Type here..."></div>
    </div>
    <div class="card-actions">
      <button class="card-action-btn" title="Reject">\u2715</button>
      <button class="card-action-btn" title="Star">\u2605</button>
      <button class="card-action-btn" title="Riff">\u21bb</button>
    </div>
  `;

  // Card action handlers
  card.querySelectorAll('.card-action-btn').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (btn.title === 'Reject') {
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9)';
        card.style.transition = 'all 200ms ease';
        setTimeout(() => card.remove(), 200);
      } else if (btn.title === 'Star') {
        btn.style.color = btn.style.color === 'rgb(251, 191, 36)' ? '' : '#fbbf24';
      }
    });
  });

  card.addEventListener('mousedown', ev => {
    if (ev.target.closest('.card-action-btn') || ev.target.isContentEditable || activeTool === 'hand') return;
    ev.stopPropagation();
    dragCard = card;
    const rect = card.getBoundingClientRect();
    dragOffsetX = (ev.clientX - rect.left) / scale;
    dragOffsetY = (ev.clientY - rect.top) / scale;
    card.style.zIndex = 50;
    card.style.cursor = 'grabbing';
  });

  inner.appendChild(card);
  // Focus the editable text
  setTimeout(() => {
    const editable = card.querySelector('[contenteditable]');
    if (editable) editable.focus();
  }, 50);
});

// ── NEW BLOCK BUTTON ──
document.getElementById('new-block-btn').addEventListener('click', () => {
  const cx = (-panX + window.innerWidth / 2) / scale;
  const cy = (-panY + window.innerHeight / 2) / scale;
  const fakeEvent = { clientX: window.innerWidth / 2, clientY: window.innerHeight / 2, target: wrap };
  // Spawn a card at center
  const card = document.createElement('div');
  card.className = 'card';
  card.style.left = (cx - 90) + 'px';
  card.style.top = (cy - 65) + 'px';
  card.style.borderLeftColor = stickyColor;
  card.style.zIndex = 10;

  const typeForColor = Object.entries(COLORS).find(([, v]) => v === stickyColor);
  const typeName = typeForColor ? typeForColor[0].charAt(0).toUpperCase() + typeForColor[0].slice(1) : 'Note';

  card.innerHTML = `
    <div class="card-content">
      <div class="card-type-label" style="color:${stickyColor}">${typeName}</div>
      <div class="card-text" contenteditable="true" style="outline:none;cursor:text;"></div>
    </div>
    <div class="card-actions">
      <button class="card-action-btn" title="Reject">\u2715</button>
      <button class="card-action-btn" title="Star">\u2605</button>
      <button class="card-action-btn" title="Riff">\u21bb</button>
    </div>
  `;

  card.querySelectorAll('.card-action-btn').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      if (btn.title === 'Reject') {
        card.style.opacity = '0'; card.style.transform = 'scale(0.9)'; card.style.transition = 'all 200ms ease';
        setTimeout(() => card.remove(), 200);
      } else if (btn.title === 'Star') {
        btn.style.color = btn.style.color === 'rgb(251, 191, 36)' ? '' : '#fbbf24';
      }
    });
  });

  card.addEventListener('mousedown', ev => {
    if (ev.target.closest('.card-action-btn') || ev.target.isContentEditable || activeTool === 'hand') return;
    ev.stopPropagation();
    dragCard = card;
    const rect = card.getBoundingClientRect();
    dragOffsetX = (ev.clientX - rect.left) / scale;
    dragOffsetY = (ev.clientY - rect.top) / scale;
    card.style.zIndex = 50;
    card.style.cursor = 'grabbing';
  });

  inner.appendChild(card);
  setTimeout(() => {
    const editable = card.querySelector('[contenteditable]');
    if (editable) editable.focus();
  }, 50);
});

// Close sticky dropdown on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('.sticky-dropdown') && !e.target.closest('[data-tool="sticky"]')) {
    stickyDropdown.classList.remove('open');
  }
});

// Init
updateTransform();
</script>
