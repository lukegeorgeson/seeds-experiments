<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V16 Dense Board, Convergence Without Rounds</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react/": "https://esm.sh/react@18/",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/": "https://esm.sh/react-dom@18/",
      "@xyflow/react": "https://esm.sh/@xyflow/react@12?external=react,react-dom",
      "@xyflow/react/": "https://esm.sh/@xyflow/react@12&external=react,react-dom/"
    }
  }
  </script>
  <style>
    body { margin: 0; font-family: 'JetBrains Mono', monospace; background: #0a0a0d; color: #d0d0d0; }

    .zone-dense {
      border-radius: 12px;
      width: 100%; height: 100%;
      position: relative;
    }
    .zone-dense-header {
      position: absolute;
      top: -14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 2;
    }
    .zone-dense-name {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 5px;
      background: #0a0a0d;
    }
    .zone-stats {
      font-size: 9px;
      color: #444;
      display: flex;
      gap: 6px;
    }
    .zone-stats span { display: flex; align-items: center; gap: 2px; }
    .zone-generate-btn {
      position: absolute;
      bottom: 10px;
      right: 12px;
      background: rgba(234,193,245,0.08);
      border: 1px solid rgba(234,193,245,0.12);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 9px;
      font-weight: 500;
      color: #c99dd6;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      z-index: 2;
    }

    .card-dense {
      background: #141418;
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 8px 10px 8px 14px;
      width: 175px;
      font-size: 11px;
      line-height: 1.4;
      color: #b0b0b0;
      transition: all 0.2s;
      position: relative;
    }
    .card-dense:hover {
      border-color: rgba(255,255,255,0.1);
    }
    .card-dense .type-bar {
      width: 2px; border-radius: 1px;
      position: absolute; left: 3px; top: 6px; bottom: 6px;
    }
    .card-dense.selected {
      border-color: rgba(234,193,245,0.3);
      box-shadow: 0 0 8px rgba(234,193,245,0.08);
    }
    .card-dense.locked {
      border-color: rgba(234,193,245,0.4);
      border-width: 1.5px;
    }
    .card-dense.locked::after {
      content: '🔒';
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 8px;
    }
    .card-dense.rejected {
      opacity: 0.3;
      border-color: rgba(239,68,68,0.2);
    }
    .card-dense.rejected .card-text {
      text-decoration: line-through;
      text-decoration-color: rgba(239,68,68,0.3);
    }

    .convergence-zone {
      border: 1px solid rgba(234,193,245,0.25) !important;
      background: rgba(234,193,245,0.02) !important;
    }

    .filter-bar {
      position: fixed;
      top: 56px;
      right: 20px;
      display: flex;
      gap: 4px;
      z-index: 100;
    }
    .filter-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      font-size: 10px;
      color: #888;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
    }
    .filter-btn.active {
      background: rgba(234,193,245,0.1);
      border-color: rgba(234,193,245,0.2);
      color: #eac1f5;
    }

    .export-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      height: 100vh;
      background: #111115;
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 60px 20px 20px;
      overflow-y: auto;
      z-index: 90;
      font-size: 12px;
      line-height: 1.6;
      color: #999;
    }
    .export-panel h3 {
      font-size: 12px;
      font-weight: 600;
      color: #ddd;
      margin: 16px 0 8px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .top-bar-dense {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(10,10,13,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .react-flow__background { opacity: 0.25; }
    .react-flow__controls button { background: #1a1a1e !important; color: #888 !important; border-color: #2a2a2e !important; }
    .react-flow__minimap { background: #111 !important; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="root" style="width:100vw;height:100vh;"></div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      ReactFlow,
      Background,
      Controls,
      MiniMap,
      useNodesState,
      useEdgesState,
      Handle,
      Position,
    } from '@xyflow/react';

    const h = React.createElement;

    const COLORS = {
      ideas: '#34d399',
      tensions: '#f472b6',
      signals: '#38bdf8',
      strategy: '#a78bfa',
      frameworks: '#fb923c',
    };

    function ZoneNode({ data }) {
      const color = COLORS[data.zoneType] || '#555';
      const isConvergence = data.isConvergence;
      return h('div', {
        className: `zone-dense ${isConvergence ? 'convergence-zone' : ''}`,
        style: {
          width: '100%', height: '100%',
          border: `1px solid ${color}22`,
          background: `${color}04`,
        }
      },
        h('div', { className: 'zone-dense-header' },
          h('span', { className: 'zone-dense-name', style: { color } }, data.label),
          h('div', { className: 'zone-stats' },
            data.locked > 0 && h('span', null, `${data.locked} locked`),
            data.selected > 0 && h('span', null, `${data.selected} sel`),
            data.rejected > 0 && h('span', { style: { color: '#ef444466' } }, `${data.rejected} rej`),
          ),
        ),
        h('div', { className: 'zone-generate-btn' }, 'Generate in zone →'),
      );
    }

    function CardNode({ data }) {
      const color = COLORS[data.cardType] || '#555';
      let className = 'card-dense';
      if (data.isLocked) className += ' locked';
      else if (data.isSelected) className += ' selected';
      if (data.isRejected) className += ' rejected';

      return h('div', { className },
        h('div', { className: 'type-bar', style: { background: color } }),
        h('div', { className: 'card-text' }, data.text),
        h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0, width: 4, height: 4 } }),
        h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0, width: 4, height: 4 } }),
      );
    }

    const nodeTypes = { zone: ZoneNode, card: CardNode };

    // Build dense board data
    const zones = [
      { id: 'z-div', label: 'Divergent', zoneType: 'ideas', x: 40, y: 80, w: 440, h: 460, locked: 0, selected: 2, rejected: 3 },
      { id: 'z-ten', label: 'Tensions', zoneType: 'tensions', x: 520, y: 80, w: 400, h: 280, locked: 1, selected: 1, rejected: 1 },
      { id: 'z-sig', label: 'Signals', zoneType: 'signals', x: 520, y: 400, w: 400, h: 280, locked: 0, selected: 2, rejected: 0 },
      { id: 'z-str', label: 'Strategy', zoneType: 'strategy', x: 960, y: 80, w: 400, h: 350, locked: 2, selected: 1, rejected: 0 },
      { id: 'z-conv', label: 'Convergence', zoneType: 'strategy', x: 960, y: 470, w: 400, h: 280, locked: 3, selected: 2, rejected: 0, isConvergence: true },
    ];

    const cardTexts = {
      'z-div': [
        { t: 'Guerrilla pop-up activations at music festivals', sel: true },
        { t: 'Athlete-founded sub-brand for training apparel', rej: true },
        { t: 'Subscription model for seasonal capsule drops', sel: true },
        { t: 'Upcycled materials line at accessible price point' },
        { t: 'AI-powered personal styling recommendations', rej: true },
        { t: 'Collaborative limited runs with streetwear labels' },
        { t: 'Carbon-neutral shipping as standard', rej: true },
        { t: 'Community design challenges with production commitments' },
      ],
      'z-ten': [
        { t: 'Performance fabrics vs sustainability claims conflict', lock: true },
        { t: 'Heritage brand perception vs desire for youth relevance', sel: true },
        { t: 'Direct-to-consumer cannibalises wholesale partnerships', rej: true },
        { t: 'Innovation speed vs quality control standards' },
      ],
      'z-sig': [
        { t: 'Athleisure growth slowing, quiet luxury accelerating', sel: true },
        { t: 'Social commerce conversion rates 3x traditional ecom' },
        { t: 'Resale platforms driving brand discovery for under-25s', sel: true },
        { t: 'Material innovation enabling new form factors' },
      ],
      'z-str': [
        { t: 'Position at intersection of performance and lifestyle', lock: true },
        { t: 'Build community through shared values not transactions', lock: true },
        { t: 'Premiumise hero products, democratise entry range', sel: true },
      ],
      'z-conv': [
        { t: 'Core positioning: performance heritage meets conscious innovation', lock: true },
        { t: 'Community-first distribution — ambassadors over influencers', lock: true },
        { t: 'Dual-tier pricing: premium crafted + accessible essential', lock: true },
        { t: 'Cultural tension as creative fuel for brand narrative', sel: true },
        { t: 'Resale-integrated lifecycle extending brand touchpoints', sel: true },
      ],
    };

    const initialNodes = [];
    const initialEdges = [];

    zones.forEach(z => {
      initialNodes.push({
        id: z.id,
        type: 'zone',
        position: { x: z.x, y: z.y },
        data: { label: z.label, zoneType: z.zoneType, locked: z.locked, selected: z.selected, rejected: z.rejected, isConvergence: z.isConvergence },
        style: { width: z.w, height: z.h },
      });
      const cards = cardTexts[z.id] || [];
      cards.forEach((c, i) => {
        initialNodes.push({
          id: `${z.id}-c${i}`,
          type: 'card',
          position: { x: 12 + (i % 2) * 195, y: 22 + Math.floor(i / 2) * 90 },
          parentId: z.id,
          extent: 'parent',
          data: {
            text: c.t,
            cardType: z.zoneType,
            isSelected: c.sel || false,
            isLocked: c.lock || false,
            isRejected: c.rej || false,
          },
        });
      });
    });

    function App() {
      const [nodes, , onNodesChange] = useNodesState(initialNodes);
      const [edges, , onEdgesChange] = useEdgesState(initialEdges);
      const [filter, setFilter] = useState('all');
      const [showExport, setShowExport] = useState(false);

      return h('div', { style: { width: '100vw', height: '100vh' } },
        h('div', { className: 'top-bar-dense' },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
            h('span', { style: { fontWeight: 600, fontSize: '13px' } }, 'EV Brand vs Tesla'),
            h('span', { style: { fontSize: '10px', color: '#555' } }, '5 zones · 24 cards'),
          ),
          h('div', { style: { display: 'flex', gap: '6px' } },
            h('button', {
              className: `filter-btn ${filter === 'all' ? 'active' : ''}`,
              onClick: () => setFilter('all'),
            }, 'Show all'),
            h('button', {
              className: `filter-btn ${filter === 'endorsed' ? 'active' : ''}`,
              onClick: () => setFilter('endorsed'),
            }, 'Endorsed only'),
            h('button', {
              className: 'filter-btn',
              onClick: () => setShowExport(!showExport),
              style: showExport ? { background: 'rgba(234,193,245,0.1)', color: '#eac1f5', borderColor: 'rgba(234,193,245,0.2)' } : {},
            }, 'Export summary'),
          ),
        ),

        h(ReactFlow, {
          nodes, edges, onNodesChange, onEdgesChange,
          nodeTypes,
          fitView: true,
          fitViewOptions: { padding: 0.15 },
          style: { background: '#0a0a0d' },
          proOptions: { hideAttribution: true },
        },
          h(Background, { gap: 20, size: 1, color: 'rgba(255,255,255,0.015)' }),
          h(Controls, { showInteractive: false }),
          h(MiniMap, {
            nodeColor: (n) => {
              if (n.data?.isConvergence) return '#eac1f5';
              return COLORS[n.data?.zoneType] || '#333';
            },
          }),
        ),

        // Export panel
        showExport && h('div', { className: 'export-panel' },
          h('h3', null, '✦ Board Summary Export'),
          h('p', { style: { color: '#666', fontSize: '10px', marginBottom: '16px' } }, 'Synthesised from 5 zones, 24 cards'),
          h('h3', null, 'Convergence'),
          h('p', null, 'Core positioning centres on performance heritage meeting conscious innovation. Distribution through community ambassadors, dual-tier pricing strategy, and brand tension as creative fuel.'),
          h('h3', null, 'Strategy'),
          h('p', null, 'Position at the intersection of performance and lifestyle. Build through shared values, premiumise hero products while democratising entry range.'),
          h('h3', null, 'Key Tensions'),
          h('p', null, 'Performance fabrics vs sustainability claims remain the primary unresolved friction. Heritage perception vs youth relevance drives creative direction.'),
          h('h3', null, 'Signals'),
          h('p', null, 'Athleisure growth slowing as quiet luxury accelerates. Resale platforms becoming primary discovery channel for under-25s.'),
        ),
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
