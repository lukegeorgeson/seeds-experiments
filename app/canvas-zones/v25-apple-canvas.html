<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V25 Apple Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
      background: #fafafa;
      color: #1d1d1f;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top bar ── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(250,250,250,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 12px;
      z-index: 200;
    }
    #top-bar .separator {
      width: 1px; height: 20px;
      background: rgba(0,0,0,0.1);
      margin: 0 4px;
    }
    #project-name {
      font-size: 15px;
      font-weight: 600;
      color: #1d1d1f;
      letter-spacing: -0.01em;
    }
    .pill-badge {
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #86868b;
    }
    #share-btn {
      background: #007AFF;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: opacity 0.15s;
    }
    #share-btn:hover { opacity: 0.85; }
    .top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* ── Canvas ── */
    #canvas-container {
      position: fixed;
      top: 52px; left: 0; right: 0; bottom: 0;
      overflow: hidden;
      cursor: default;
    }
    #canvas-container.panning { cursor: grab; }
    #canvas-container.panning:active { cursor: grabbing; }

    /* dot grid */
    #canvas-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(0,0,0,0.18) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    #canvas-world {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* ── Left toolbar ── */
    #left-toolbar {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: rgba(250,250,250,0.90);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      z-index: 200;
    }
    .tool-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
      color: #1d1d1f;
      font-size: 16px;
    }
    .tool-btn:hover { background: rgba(0,0,0,0.06); }
    .tool-btn.active { background: rgba(0,122,255,0.12); color: #007AFF; }
    .tool-divider {
      width: 22px; height: 1px;
      background: rgba(0,0,0,0.08);
      margin: 2px 0;
    }
    .tool-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 0;
    }

    /* ── Bottom add bar ── */
    #bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
    }
    #add-trigger {
      background: rgba(250,250,250,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 24px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
      transition: box-shadow 0.15s;
      white-space: nowrap;
    }
    #add-trigger:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06); }
    #add-trigger .plus-icon {
      width: 20px; height: 20px;
      background: #007AFF;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
    }
    #add-trigger span {
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
    }
    #add-expanded {
      display: none;
      background: rgba(250,250,250,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 24px;
      padding: 8px;
      gap: 6px;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    }
    #add-expanded.visible { display: flex; }
    .add-option {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #1d1d1f;
      border: none;
      background: transparent;
      font-family: inherit;
      transition: background 0.12s;
    }
    .add-option:hover { background: rgba(0,0,0,0.05); }
    .add-option .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .add-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: none; background: rgba(0,0,0,0.06);
      cursor: pointer; font-size: 14px; color: #86868b;
      display: flex; align-items: center; justify-content: center;
      margin-right: 2px;
      font-family: inherit;
    }
    .add-close:hover { background: rgba(0,0,0,0.1); }

    /* ── Zone ── */
    .zone {
      position: absolute;
      border-radius: 16px;
      border: 1.5px solid;
      pointer-events: all;
    }
    .zone-label-pill {
      position: absolute;
      top: -14px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fafafa;
      border: 1.5px solid;
      border-radius: 20px;
      padding: 3px 12px 3px 8px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .zone-count-badge {
      position: absolute;
      top: -14px;
      right: 16px;
      background: #f5f5f7;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
      color: #86868b;
    }

    /* ── Zone summary card ── */
    .summary-card {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 14px;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      position: absolute;
      top: 16px;
      left: 16px;
    }
    .summary-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #86868b;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .summary-label .ai-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #007AFF;
    }
    .summary-text {
      font-size: 13px;
      line-height: 1.58;
      color: #1d1d1f;
    }
    .summary-meta {
      font-size: 11px;
      color: #aeaeb2;
      margin-top: 10px;
    }

    /* ── Cards ── */
    .card {
      position: absolute;
      width: 180px;
      height: 130px;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.07);
      border-radius: 14px;
      padding: 12px 12px 12px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: grab;
      user-select: none;
      overflow: hidden;
      transition: box-shadow 0.18s, transform 0.18s;
    }
    .card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 8px rgba(0,0,0,0.06);
      transform: translateY(-1px);
    }
    .card:active { cursor: grabbing; }
    .card .type-bar {
      position: absolute;
      left: 0; top: 10px; bottom: 10px;
      width: 3px;
      border-radius: 0 2px 2px 0;
    }
    .card .card-type-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .card .card-text {
      font-size: 12px;
      line-height: 1.5;
      color: #1d1d1f;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Card hover actions */
    .card-actions {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      padding: 6px 8px;
      background: linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
      transform: translateY(100%);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 0 0 14px 14px;
    }
    .card:hover .card-actions { transform: translateY(0); }
    .action-btn {
      width: 26px; height: 26px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.08);
      background: rgba(245,245,247,0.95);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      color: #86868b;
    }
    .action-btn:hover { background: #fff; border-color: rgba(0,0,0,0.14); color: #1d1d1f; }
    .action-btn.reject:hover { color: #ff3b30; border-color: rgba(255,59,48,0.3); }
    .action-btn.star:hover { color: #ff9f0a; border-color: rgba(255,159,10,0.3); }
    .action-btn.riff:hover { color: #007AFF; border-color: rgba(0,122,255,0.3); }

    /* drag state */
    .card.dragging {
      box-shadow: 0 16px 40px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.1);
      transform: scale(1.03) rotate(1deg);
      cursor: grabbing;
      z-index: 500;
    }
  </style>
</head>

<script>
(function() {
  // ── Data ──────────────────────────────────────────────────────────────────

  const COLORS = {
    ideas:     { bar: '#34d399', label: '#059669', zone: 'rgba(52,211,153,0.12)',  border: 'rgba(52,211,153,0.28)'  },
    tensions:  { bar: '#f472b6', label: '#db2777', zone: 'rgba(244,114,182,0.10)', border: 'rgba(244,114,182,0.26)' },
    signals:   { bar: '#38bdf8', label: '#0284c7', zone: 'rgba(56,189,248,0.10)',  border: 'rgba(56,189,248,0.26)'  },
    direction: { bar: '#a78bfa', label: '#7c3aed', zone: 'rgba(167,139,250,0.10)', border: 'rgba(167,139,250,0.26)' },
  };

  const ZONES = [
    {
      id: 'zone-ideas',
      label: 'Campaign Ideas',
      type: 'ideas',
      x: 80, y: 60,
      width: 620, height: 500,
      summary: 'The emerging direction centres on experiential storytelling — shifting from product-first messaging to culture-embedded narratives. Strong signals toward community co-creation and radical transparency as key differentiators.',
      summaryAge: '2m ago',
      cards: [
        { id: 'c1', x: 16, y: 120, text: 'Experiential pop-ups as brand storytelling vehicles', type: 'ideas' },
        { id: 'c2', x: 214, y: 120, text: 'User-generated content as the primary creative asset', type: 'ideas' },
        { id: 'c3', x: 412, y: 120, text: 'Collaboration with emerging artists over established celebrities', type: 'ideas' },
        { id: 'c4', x: 16, y: 264, text: 'Seasonal micro-campaigns vs one big annual push', type: 'ideas' },
        { id: 'c5', x: 214, y: 264, text: 'Behind-the-scenes content as trust-building mechanism', type: 'ideas' },
        { id: 'c6', x: 412, y: 264, text: 'Community voting on next product colourway', type: 'ideas' },
      ]
    },
    {
      id: 'zone-tensions',
      label: 'Audience Tensions',
      type: 'tensions',
      x: 730, y: 60,
      width: 560, height: 440,
      summary: 'Core tension between desire for authenticity and appetite for convenience. Audience is sceptical of brand claims but highly responsive to peer endorsement and earned trust signals.',
      summaryAge: '14m ago',
      cards: [
        { id: 'c7',  x: 16, y: 120, text: 'Customers want ethical products but won\'t pay a premium for them', type: 'tensions' },
        { id: 'c8',  x: 214, y: 120, text: 'Social media distrust is rising but engagement is still socially led', type: 'tensions' },
        { id: 'c9',  x: 16, y: 264, text: 'Desire for uniqueness conflicts with desire to belong to a tribe', type: 'tensions' },
        { id: 'c10', x: 214, y: 264, text: 'Sustainability fatigue — audience tired of empty brand pledges', type: 'tensions' },
      ]
    },
    {
      id: 'zone-signals',
      label: 'Market Signals',
      type: 'signals',
      x: 80, y: 600,
      width: 560, height: 300,
      summary: 'Discovery channels are fragmenting fast. TikTok Shop and secondhand platforms are redefining the purchase funnel — brands anchored to traditional retail discovery are losing relevance with under-30 cohorts.',
      summaryAge: '1h ago',
      cards: [
        { id: 'c11', x: 16, y: 120, text: 'TikTok Shop driving 60% of Gen Z product discovery', type: 'signals' },
        { id: 'c12', x: 214, y: 120, text: 'Secondhand luxury market growing 3× faster than new', type: 'signals' },
        { id: 'c13', x: 412, y: 120, text: 'Brand loyalty declining — 78% switched brands this year', type: 'signals' },
      ]
    },
  ];

  // ── Canvas state ─────────────────────────────────────────────────────────

  let panX = 0, panY = 0, scale = 1;
  let isPanning = false, panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
  let activeTool = 'select';

  // Card drag state
  let draggingCard = null, dragOffsetX = 0, dragOffsetY = 0;

  const world = document.getElementById('canvas-world');
  const container = document.getElementById('canvas-container');

  function setTransform() {
    world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }

  // ── Build DOM ─────────────────────────────────────────────────────────────

  function makeCard(card) {
    const color = COLORS[card.type] || COLORS.ideas;
    const el = document.createElement('div');
    el.className = 'card';
    el.id = card.id;
    el.style.left = card.x + 'px';
    el.style.top  = card.y + 'px';

    el.innerHTML = `
      <div class="type-bar" style="background:${color.bar};"></div>
      <div class="card-type-label" style="color:${color.label};">${card.type.charAt(0).toUpperCase() + card.type.slice(1)}</div>
      <div class="card-text">${card.text}</div>
      <div class="card-actions">
        <button class="action-btn reject" title="Reject">✕</button>
        <button class="action-btn star"   title="Star">★</button>
        <button class="action-btn riff"   title="Riff">↻</button>
      </div>
    `;

    // Card drag
    el.addEventListener('mousedown', onCardMouseDown);
    el.querySelectorAll('.action-btn').forEach(btn => {
      btn.addEventListener('mousedown', e => e.stopPropagation());
    });

    return el;
  }

  function makeZone(zone) {
    const color = COLORS[zone.type] || COLORS.ideas;
    const el = document.createElement('div');
    el.className = 'zone';
    el.id = zone.id;
    el.style.left    = zone.x + 'px';
    el.style.top     = zone.y + 'px';
    el.style.width   = zone.width + 'px';
    el.style.height  = zone.height + 'px';
    el.style.background = color.zone;
    el.style.borderColor = color.border;

    // Label pill
    const pill = document.createElement('div');
    pill.className = 'zone-label-pill';
    pill.style.borderColor = color.border;
    pill.style.color = color.label;
    pill.innerHTML = `<span style="width:8px;height:8px;border-radius:50%;background:${color.bar};display:inline-block;flex-shrink:0;"></span>${zone.label}`;
    el.appendChild(pill);

    // Count badge
    const badge = document.createElement('div');
    badge.className = 'zone-count-badge';
    badge.textContent = zone.cards.length + ' cards';
    el.appendChild(badge);

    // Summary card
    const sumCard = document.createElement('div');
    sumCard.className = 'summary-card';
    sumCard.style.width = (zone.width - 32) + 'px';
    sumCard.innerHTML = `
      <div class="summary-label">
        <span class="ai-dot" style="background:${color.bar};"></span>
        AI Summary
      </div>
      <div class="summary-text">${zone.summary}</div>
      <div class="summary-meta">Summarised from ${zone.cards.length} cards · ${zone.summaryAge}</div>
    `;
    el.appendChild(sumCard);

    // Cards
    zone.cards.forEach(card => {
      el.appendChild(makeCard(card));
    });

    return el;
  }

  // Render all zones
  ZONES.forEach(zone => {
    world.appendChild(makeZone(zone));
  });

  // Initial pan to center content nicely
  panX = 80;
  panY = 40;
  scale = 0.9;
  setTransform();

  // ── Tool buttons ──────────────────────────────────────────────────────────

  const toolBtns = document.querySelectorAll('.tool-btn');
  toolBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      toolBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTool = btn.id.replace('tool-', '');
      container.style.cursor = activeTool === 'pan' ? 'grab' : 'default';
    });
  });

  // ── Pan / zoom ────────────────────────────────────────────────────────────

  container.addEventListener('mousedown', (e) => {
    if (e.target.closest('.card') && activeTool === 'select') return;
    if (e.target.closest('.zone-label-pill')) return;
    if (e.target.closest('.zone-count-badge')) return;
    if (e.target.closest('.summary-card')) return;

    if (activeTool === 'pan' || e.button === 1 || e.altKey) {
      isPanning = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panOriginX = panX;
      panOriginY = panY;
      container.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (isPanning) {
      panX = panOriginX + (e.clientX - panStartX);
      panY = panOriginY + (e.clientY - panStartY);
      setTransform();
    }
    if (draggingCard) {
      // Compute canvas-world coords
      const rect = container.getBoundingClientRect();
      const worldX = (e.clientX - rect.left - panX) / scale;
      const worldY = (e.clientY - rect.top  - panY) / scale;

      const newLeft = worldX - dragOffsetX;
      const newTop  = worldY - dragOffsetY;
      draggingCard.style.left = newLeft + 'px';
      draggingCard.style.top  = newTop  + 'px';
    }
  });

  window.addEventListener('mouseup', () => {
    if (isPanning) {
      isPanning = false;
      container.style.cursor = activeTool === 'pan' ? 'grab' : 'default';
    }
    if (draggingCard) {
      draggingCard.classList.remove('dragging');
      draggingCard = null;
    }
  });

  // Zoom with wheel
  container.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const delta = e.deltaY < 0 ? 1.08 : 0.93;
    const newScale = Math.max(0.2, Math.min(3, scale * delta));

    // Zoom towards mouse cursor
    panX = mouseX - (mouseX - panX) * (newScale / scale);
    panY = mouseY - (mouseY - panY) * (newScale / scale);
    scale = newScale;
    setTransform();
  }, { passive: false });

  // ── Card drag ─────────────────────────────────────────────────────────────

  function onCardMouseDown(e) {
    if (activeTool !== 'select') return;
    if (e.target.closest('.action-btn')) return;
    e.stopPropagation();

    const card = e.currentTarget;
    draggingCard = card;
    card.classList.add('dragging');

    const rect = container.getBoundingClientRect();
    const worldX = (e.clientX - rect.left - panX) / scale;
    const worldY = (e.clientY - rect.top  - panY) / scale;
    dragOffsetX = worldX - parseInt(card.style.left);
    dragOffsetY = worldY - parseInt(card.style.top);

    // Bring to front
    card.style.zIndex = 500;
  }

  // ── Bottom add bar ────────────────────────────────────────────────────────

  const addTrigger  = document.getElementById('add-trigger');
  const addExpanded = document.getElementById('add-expanded');

  addTrigger.addEventListener('click', () => {
    addTrigger.style.display = 'none';
    addExpanded.classList.add('visible');
  });

  document.querySelector('.add-close').addEventListener('click', () => {
    addExpanded.classList.remove('visible');
    addTrigger.style.display = 'flex';
  });

  document.querySelectorAll('.add-option').forEach(btn => {
    btn.addEventListener('click', () => {
      addExpanded.classList.remove('visible');
      addTrigger.style.display = 'flex';
    });
  });

  // ── Keyboard shortcuts ────────────────────────────────────────────────────

  window.addEventListener('keydown', (e) => {
    if (e.key === 'v' || e.key === 'V') {
      document.getElementById('tool-select').click();
    }
    if (e.key === 'h' || e.key === 'H') {
      document.getElementById('tool-pan').click();
    }
    if (e.key === ' ') {
      // spacebar = temporary pan
      if (activeTool !== 'pan') container.style.cursor = 'grab';
    }
    if (e.key === '0') {
      // reset zoom
      panX = 80; panY = 40; scale = 0.9;
      setTransform();
    }
    if (e.key === '=' || e.key === '+') {
      scale = Math.min(3, scale * 1.1);
      setTransform();
    }
    if (e.key === '-') {
      scale = Math.max(0.2, scale / 1.1);
      setTransform();
    }
  });

  window.addEventListener('keyup', (e) => {
    if (e.key === ' ' && activeTool !== 'pan') {
      container.style.cursor = 'default';
    }
  });

})();
</script>
</body>
</html>
