<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V26 Figma Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-canvas: #1e1e1e;
      --bg-panel: #2c2c2c;
      --bg-panel-hover: #353535;
      --border: #3c3c3c;
      --border-light: #454545;
      --text-primary: #e0e0e0;
      --text-secondary: #999999;
      --text-muted: #666666;
      --accent: #a259ff;
      --accent-dim: rgba(162,89,255,0.15);
      --green: #1bc47d;
      --green-dim: rgba(27,196,125,0.12);
      --pink: #ff6b8a;
      --pink-dim: rgba(255,107,138,0.12);
      --blue: #4da6ff;
      --blue-dim: rgba(77,166,255,0.12);
      --purple: #a259ff;
      --purple-dim: rgba(162,89,255,0.12);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
      font-size: 12px;
    }

    /* ─── Top Bar ─────────────────────────────── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 40px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 0;
      z-index: 300;
      user-select: none;
    }

    #logo-wrap {
      display: flex;
      align-items: center;
      padding-right: 16px;
      margin-right: 8px;
      border-right: 1px solid var(--border);
      height: 100%;
    }

    #toolbar-tools {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 8px;
    }

    .tool-btn {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
      position: relative;
    }
    .tool-btn:hover { background: var(--border); color: var(--text-primary); }
    .tool-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .tool-btn svg { width: 14px; height: 14px; }

    .tool-divider {
      width: 1px; height: 20px;
      background: var(--border);
      margin: 0 6px;
    }

    .card-type-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 500;
      transition: background 0.1s, color 0.1s;
    }
    .card-type-btn:hover { background: var(--border); color: var(--text-primary); }
    .card-type-btn .dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .top-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
    }

    #zoom-display {
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      min-width: 52px;
      text-align: center;
      transition: border-color 0.1s;
    }
    #zoom-display:hover { border-color: var(--border-light); color: var(--text-primary); }

    #share-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 5px;
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      letter-spacing: 0.01em;
    }
    #share-btn:hover { opacity: 0.85; }

    /* ─── Left Panel (Layers) ──────────────────── */
    #left-panel {
      position: fixed;
      top: 40px; left: 0; bottom: 0;
      width: 240px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 12px 8px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .panel-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    #layers-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    #layers-list::-webkit-scrollbar { width: 4px; }
    #layers-list::-webkit-scrollbar-track { background: transparent; }
    #layers-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

    .layer-zone-header {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background 0.1s;
    }
    .layer-zone-header:hover { background: var(--border); }
    .layer-zone-header .zone-icon {
      width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 2px;
      font-size: 9px;
      flex-shrink: 0;
    }
    .layer-zone-header .chevron {
      width: 12px; height: 12px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: transform 0.15s;
      margin-left: auto;
      font-size: 9px;
    }
    .layer-zone-header.collapsed .chevron { transform: rotate(-90deg); }
    .layer-zone-header .count {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--border);
      border-radius: 3px;
      padding: 1px 5px;
      margin-left: 4px;
    }

    .layer-zone-cards {
      overflow: hidden;
    }
    .layer-card-item {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 12px 4px 28px;
      cursor: pointer;
      font-size: 11px;
      color: var(--text-muted);
      transition: background 0.1s, color 0.1s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .layer-card-item:hover { background: var(--border); color: var(--text-primary); }
    .layer-card-item.selected { background: var(--accent-dim); color: var(--accent); }
    .layer-card-item .card-dot {
      width: 8px; height: 8px;
      border-radius: 1.5px;
      flex-shrink: 0;
    }

    /* ─── Right Panel (Properties) ────────────── */
    #right-panel {
      position: fixed;
      top: 40px; right: 0; bottom: 0;
      width: 240px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 200;
    }

    .prop-section {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .prop-section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .prop-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 5px;
    }
    .prop-label {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .prop-value {
      font-size: 11px;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .prop-input {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 6px;
      font-size: 11px;
      color: var(--text-primary);
      font-family: inherit;
      width: 70px;
      text-align: right;
    }
    .prop-input:focus { outline: none; border-color: var(--accent); }

    .color-swatch-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 5px;
    }
    .color-swatch {
      width: 16px; height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .no-selection-msg {
      padding: 20px 12px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    /* ─── Canvas Area ──────────────────────────── */
    #canvas-container {
      position: fixed;
      top: 40px;
      left: 240px;
      right: 240px;
      bottom: 0;
      overflow: hidden;
      cursor: default;
      background: var(--bg-canvas);
    }
    #canvas-container.panning { cursor: grab; }
    #canvas-container.panning:active { cursor: grabbing; }

    #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 4000px; height: 4000px;
      transform-origin: 0 0;
    }

    /* Dot grid */
    #canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, #3a3a3a 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    /* ─── Zones ────────────────────────────────── */
    .zone {
      position: absolute;
      border-radius: 6px;
      padding: 40px 16px 16px;
    }

    .zone-label {
      position: absolute;
      top: -22px; left: 0;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: flex; align-items: center; gap: 6px;
    }
    .zone-label .zone-name-text {}
    .zone-label .zone-count {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.7;
      background: rgba(0,0,0,0.25);
      border-radius: 3px;
      padding: 1px 5px;
    }

    .zone-summary {
      margin-bottom: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .zone-summary strong {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-secondary);
      display: block;
      margin-bottom: 3px;
    }

    .zone-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ─── Cards ────────────────────────────────── */
    .card {
      width: 180px; height: 130px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 10px 10px 10px 14px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.15s, box-shadow 0.15s;
      user-select: none;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      border-radius: 5px 0 0 5px;
    }
    .card:hover { border-color: var(--border-light); }
    .card.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 12px rgba(162,89,255,0.2);
    }

    .card-type-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
      display: block;
    }
    .card-text {
      font-size: 11px;
      color: #c8c8c8;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      position: absolute;
      top: 6px; right: 6px;
      display: none;
      gap: 3px;
    }
    .card:hover .card-actions { display: flex; }
    .card-action-btn {
      width: 20px; height: 20px;
      border-radius: 3px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: background 0.1s, color 0.1s;
    }
    .card-action-btn:hover { background: var(--border); color: var(--text-primary); }
    .card-action-btn.reject:hover { color: var(--pink); border-color: var(--pink); }
    .card-action-btn.star:hover { color: #fbbf24; border-color: #fbbf24; }
    .card-action-btn.riff:hover { color: var(--accent); border-color: var(--accent); }

    /* ─── Bottom Toolbar ───────────────────────── */
    #bottom-toolbar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 5px 6px;
      display: flex;
      align-items: center;
      gap: 2px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.3);
    }
    .bottom-tool-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .bottom-tool-btn:hover { background: var(--border); color: var(--text-primary); }
    .bottom-tool-btn .dot {
      width: 10px; height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .bottom-divider {
      width: 1px; height: 16px;
      background: var(--border);
      margin: 0 2px;
    }

    /* ─── Scrollbars ───────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

    /* ─── Dragging ─────────────────────────────── */
    .zone.dragging { opacity: 0.85; z-index: 50; }
    .card.dragging-card { opacity: 0.85; z-index: 60; }

    /* ─── Tooltip ──────────────────────────────── */
    [data-tooltip] {
      position: relative;
    }
    [data-tooltip]:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: var(--text-primary);
      font-size: 10px;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
      white-space: nowrap;
      pointer-events: none;
      z-index: 400;
    }
  </style>
</head>

  <div id="toolbar-tools">
    <!-- Move tool -->
    <div class="tool-btn active" id="tool-move" data-tool="move" data-tooltip="Move (V)">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 1l1.5 9.5 2.5-2.5 3 4.5 1.5-1-3-4.5 3.5-.5L4 1z"/></svg>
    </div>
    <!-- Hand tool -->
    <div class="tool-btn" id="tool-hand" data-tool="hand" data-tooltip="Hand (H)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 2v6M5.5 4v4M3 5.5v3.5a5 5 0 0010 0V7"/><rect x="10.5" y="5" width="1" height="3" rx="0.5"/></svg>
    </div>
    <!-- Frame tool -->
    <div class="tool-btn" id="tool-frame" data-tool="frame" data-tooltip="Frame (F)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="10" height="10" rx="1"/><line x1="3" y1="1" x2="3" y2="3"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="13" y1="1" x2="13" y2="3"/><line x1="15" y1="3" x2="13" y2="3"/><line x1="15" y1="8" x2="13" y2="8"/><line x1="15" y1="13" x2="13" y2="13"/></svg>
    </div>

<script>
// ══════════════════════════════════════════════

const ZONES = [

const TYPE_META = {
  idea:      { label: 'Idea',      color: '#1bc47d' },
  tension:   { label: 'Tension',   color: '#ff6b8a' },
  signal:    { label: 'Signal',    color: '#4da6ff' },
  direction: { label: 'Direction', color: '#a259ff' },

  insights:  { label: 'Signal',    color: '#4da6ff' },

function getCardType(zoneType) {
  const map = {
    ideas: 'idea', tensions: 'tension', signals: 'signal',
    strategy: 'direction', insights: 'signal', frameworks: 'tension'
  };
  return map[zoneType] || 'idea';
}

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let pan = { x: 40, y: 40 };
let zoom = 1;
let selectedId = null;
let activeTool = 'move';
const zoneCollapsed = {};

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function renderCanvas() {
  const canvas = document.getElementById('canvas');
  canvas.innerHTML = '';

  ZONES.forEach(zone => {
    const el = document.createElement('div');
    el.className = 'zone';
    el.id = zone.id;
    el.style.cssText = `
      left: ${zone.x}px; top: ${zone.y}px;
      background: ${zone.colorDim};
      border: 1.5px dashed ${zone.borderColor};
      min-width: 620px;
    `;

    // Label
    const label = document.createElement('div');
    label.className = 'zone-label';
    label.style.color = zone.color;
    label.innerHTML = `
      <span class="zone-name-text">${zone.name}</span>
      <span class="zone-count">${zone.cards.length} cards</span>
    `;
    el.appendChild(label);

    // Summary
    const summary = document.createElement('div');
    summary.className = 'zone-summary';
    summary.innerHTML = `<strong>Zone Summary</strong>${zone.summary}`;
    el.appendChild(summary);

    // Cards
    const cardRow = document.createElement('div');
    cardRow.className = 'zone-cards';

    zone.cards.forEach(card => {
      const cardType = getCardType(zone.type);
      const meta = TYPE_META[cardType];
      const cardEl = document.createElement('div');
      cardEl.className = 'card' + (selectedId === card.id ? ' selected' : '');
      cardEl.id = card.id;
      cardEl.dataset.zoneId = zone.id;
      cardEl.dataset.cardId = card.id;

      cardEl.style.cssText = '';
      cardEl.innerHTML = `
        <div class="card-type-label" style="color:${meta.color}">${meta.label}</div>
        <div class="card-text">${card.text}</div>
        <div class="card-actions">
          <div class="card-action-btn reject" title="Reject">✕</div>
          <div class="card-action-btn star" title="Star">★</div>
          <div class="card-action-btn riff" title="Riff">↻</div>
        </div>
      `;

      // Color bar
      cardEl.style.setProperty('--card-color', meta.color);
      const style = document.createElement('style');
      style.textContent = `#${card.id}::before { background: ${meta.color}; }`;
      document.head.appendChild(style);

      cardEl.addEventListener('mousedown', e => onCardMousedown(e, card.id, zone.id));
      cardRow.appendChild(cardEl);
    });

    el.appendChild(cardRow);
    makeDraggable(el, zone);
    canvas.appendChild(el);
  });

  applyTransform();
  renderLayers();
}

function applyTransform() {
  const canvas = document.getElementById('canvas');
  canvas.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`;
  document.getElementById('zoom-display').textContent = Math.round(zoom * 100) + '%';
}

// ══════════════════════════════════════════════
// LAYERS PANEL
// ══════════════════════════════════════════════
function renderLayers() {
  const list = document.getElementById('layers-list');
  list.innerHTML = '';

  ZONES.forEach(zone => {
    const collapsed = zoneCollapsed[zone.id];

    const header = document.createElement('div');
    header.className = 'layer-zone-header' + (collapsed ? ' collapsed' : '');
    header.innerHTML = `
      <div class="zone-icon" style="background:${zone.colorDim};border:1px solid ${zone.borderColor};color:${zone.color};">▣</div>
      <span style="color:${zone.color};font-size:11px;">${zone.name}</span>
      <span class="count">${zone.cards.length}</span>
      <span class="chevron">▾</span>
    `;
    header.addEventListener('click', () => {
      zoneCollapsed[zone.id] = !zoneCollapsed[zone.id];
      renderLayers();
      scrollToZone(zone.id);
    });
    list.appendChild(header);

    if (!collapsed) {
      const cardsWrap = document.createElement('div');
      cardsWrap.className = 'layer-zone-cards';
      zone.cards.forEach(card => {
        const meta = TYPE_META[getCardType(zone.type)];
        const item = document.createElement('div');
        item.className = 'layer-card-item' + (selectedId === card.id ? ' selected' : '');
        item.innerHTML = `
          <div class="card-dot" style="background:${meta.color};"></div>
          <span>${card.text.substring(0, 36)}${card.text.length > 36 ? '…' : ''}</span>
        `;
        item.addEventListener('click', () => selectCard(card.id, zone.id));
        cardsWrap.appendChild(item);
      });
      list.appendChild(cardsWrap);
    }
  });
}

function scrollToZone(zoneId) {
  const el = document.getElementById(zoneId);
  if (!el) return;
  const zone = ZONES.find(z => z.id === zoneId);
  if (!zone) return;
  const container = document.getElementById('canvas-container');
  const cw = container.offsetWidth;
  const ch = container.offsetHeight;
  pan.x = cw / 2 - (zone.x + 310) * zoom;
  pan.y = ch / 2 - (zone.y + 130) * zoom;
  applyTransform();
}

// ══════════════════════════════════════════════
// SELECTION & PROPERTIES
// ══════════════════════════════════════════════
function selectCard(cardId, zoneId) {
  selectedId = cardId;
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.layer-card-item.selected').forEach(c => c.classList.remove('selected'));
  const cardEl = document.getElementById(cardId);
  if (cardEl) cardEl.classList.add('selected');
  renderLayers();
  renderProperties(cardId, zoneId);
}

function renderProperties(cardId, zoneId) {
  const zone = ZONES.find(z => z.id === zoneId);
  const card = zone?.cards.find(c => c.id === cardId);
  if (!card || !zone) return;

  const meta = TYPE_META[getCardType(zone.type)];
  const panel = document.getElementById('properties-content');
  panel.innerHTML = `
    <div class="prop-section">
      <div class="prop-section-title">Card</div>
      <div class="prop-row">
        <span class="prop-label">Type</span>
        <span class="prop-value" style="color:${meta.color};">${meta.label}</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Zone</span>
        <span class="prop-value" style="color:${zone.color};font-size:10px;">${zone.name}</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">ID</span>
        <span class="prop-value" style="color:#666;font-size:10px;">${cardId}</span>
      </div>
    </div>
    <div class="prop-section">
      <div class="prop-section-title">Dimensions</div>
      <div class="prop-row">
        <span class="prop-label">W</span>
        <input class="prop-input" value="180" readonly />
      </div>
      <div class="prop-row">
        <span class="prop-label">H</span>
        <input class="prop-input" value="130" readonly />
      </div>
    </div>
    <div class="prop-section">
      <div class="prop-section-title">Fill</div>
      <div class="color-swatch-row">
        <div class="color-swatch" style="background:#2c2c2c;"></div>
        <span class="prop-value">#2C2C2C</span>
      </div>
    </div>
    <div class="prop-section">
      <div class="prop-section-title">Stroke</div>
      <div class="color-swatch-row">
        <div class="color-swatch" style="background:${meta.color};"></div>
        <span class="prop-value">${meta.color.toUpperCase()}</span>
      </div>
      <div class="prop-row">
        <span class="prop-label">Weight</span>
        <input class="prop-input" value="2" readonly />
      </div>
    </div>
    <div class="prop-section">
      <div class="prop-section-title">Content</div>
      <div style="font-size:10px;color:#999;line-height:1.6;padding-top:2px;">${card.text.substring(0, 120)}${card.text.length > 120 ? '...' : ''}</div>
    </div>
  `;
}

function clearSelection() {
  selectedId = null;
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  document.querySelectorAll('.layer-card-item.selected').forEach(c => c.classList.remove('selected'));
  document.getElementById('properties-content').innerHTML =
    '<div class="no-selection-msg">Select a card or zone to view properties</div>';
}

// ══════════════════════════════════════════════
// CARD CLICK
// ══════════════════════════════════════════════
let cardDragState = null;

function onCardMousedown(e, cardId, zoneId) {
  e.stopPropagation();
  if (e.button !== 0) return;
  selectCard(cardId, zoneId);

  // Prepare for possible drag (handled at document level)
  const cardEl = document.getElementById(cardId);
  const rect = cardEl.getBoundingClientRect();
  cardDragState = {
    cardId, zoneId,
    startX: e.clientX, startY: e.clientY,
    cardEl,
    dragging: false
  };
}

document.addEventListener('mousemove', e => {
  if (!cardDragState) return;
  const dx = e.clientX - cardDragState.startX;
  const dy = e.clientY - cardDragState.startY;
  if (!cardDragState.dragging && (Math.abs(dx) > 4 || Math.abs(dy) > 4)) {
    cardDragState.dragging = true;
    cardDragState.cardEl.style.position = 'fixed';
    cardDragState.cardEl.style.zIndex = '1000';
    cardDragState.cardEl.style.pointerEvents = 'none';
    cardDragState.cardEl.style.opacity = '0.85';
    cardDragState.cardEl.style.boxShadow = '0 8px 32px rgba(0,0,0,0.5)';
    const rect = cardDragState.cardEl.getBoundingClientRect();
    cardDragState.offsetX = cardDragState.startX - rect.left;
    cardDragState.offsetY = cardDragState.startY - rect.top;
  }
  if (cardDragState.dragging) {
    cardDragState.cardEl.style.left = (e.clientX - cardDragState.offsetX) + 'px';
    cardDragState.cardEl.style.top = (e.clientY - cardDragState.offsetY) + 'px';
  }
});

document.addEventListener('mouseup', () => {
  if (cardDragState && cardDragState.dragging) {
    // Reset card styling — re-render handles placing it back
    cardDragState.cardEl.style.position = '';
    cardDragState.cardEl.style.zIndex = '';
    cardDragState.cardEl.style.pointerEvents = '';
    cardDragState.cardEl.style.opacity = '';
    cardDragState.cardEl.style.boxShadow = '';
    cardDragState.cardEl.style.left = '';
    cardDragState.cardEl.style.top = '';
  }
  cardDragState = null;
});

// ══════════════════════════════════════════════
// ZONE DRAGGING
// ══════════════════════════════════════════════
function makeDraggable(el, zone) {
  let drag = null;

  el.addEventListener('mousedown', e => {
    // Only drag from zone background (not cards)
    if (e.target.closest('.card')) return;
    if (e.button !== 0) return;
    e.stopPropagation();
    drag = { startX: e.clientX, startY: e.clientY, origX: zone.x, origY: zone.y };
    el.style.cursor = 'grabbing';
    el.style.zIndex = '10';
  });

  document.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = (e.clientX - drag.startX) / zoom;
    const dy = (e.clientY - drag.startY) / zoom;
    zone.x = drag.origX + dx;
    zone.y = drag.origY + dy;
    el.style.left = zone.x + 'px';
    el.style.top = zone.y + 'px';
    el.querySelector('.zone-label').style.cssText = 'position:absolute;top:-22px;left:0;';
  });

  document.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = null;
    el.style.cursor = '';
    el.style.zIndex = '';
  });
}

// ══════════════════════════════════════════════
// CANVAS PAN / ZOOM
// ══════════════════════════════════════════════
const container = document.getElementById('canvas-container');
let panState = null;

container.addEventListener('mousedown', e => {
  if (e.target.closest('.card') || e.target.closest('.zone')) return;
  if (e.button !== 0 && e.button !== 1) return;
  if (activeTool === 'hand' || e.button === 1 || e.altKey) {
    panState = { startX: e.clientX, startY: e.clientY, startPanX: pan.x, startPanY: pan.y };
    container.classList.add('panning');
    e.preventDefault();
    clearSelection();
  } else {
    clearSelection();
  }
});

document.addEventListener('mousemove', e => {
  if (!panState) return;
  pan.x = panState.startPanX + (e.clientX - panState.startX);
  pan.y = panState.startPanY + (e.clientY - panState.startY);
  applyTransform();
});

document.addEventListener('mouseup', () => {
  if (panState) {
    panState = null;
    container.classList.remove('panning');
  }
});

// Scroll = zoom, Ctrl+scroll = precise zoom
container.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY;
  const factor = e.ctrlKey ? 0.005 : 0.001;
  const rect = container.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  const oldZoom = zoom;
  zoom = Math.min(4, Math.max(0.1, zoom - delta * factor * zoom));
  const scale = zoom / oldZoom;
  pan.x = cx - scale * (cx - pan.x);
  pan.y = cy - scale * (cy - pan.y);
  applyTransform();
}, { passive: false });

// ══════════════════════════════════════════════
// TOOL SELECTION
// ══════════════════════════════════════════════
document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    activeTool = btn.dataset.tool;
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    container.style.cursor = activeTool === 'hand' ? 'grab' : 'default';
  });
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'v' || e.key === 'V') {
    document.getElementById('tool-move').click();
  } else if (e.key === 'h' || e.key === 'H') {
    document.getElementById('tool-hand').click();
  } else if (e.key === 'f' || e.key === 'F') {
    document.getElementById('tool-frame').click();
  } else if (e.key === '+' || e.key === '=') {
    zoomTo(zoom * 1.2);
  } else if (e.key === '-') {
    zoomTo(zoom / 1.2);
  } else if (e.key === '0') {
    fitAll();
  } else if (e.key === 'Escape') {
    clearSelection();
  }
});

function zoomTo(newZoom) {
  const rect = container.getBoundingClientRect();
  const cx = rect.width / 2;
  const cy = rect.height / 2;
  const oldZoom = zoom;
  zoom = Math.min(4, Math.max(0.1, newZoom));
  const scale = zoom / oldZoom;
  pan.x = cx - scale * (cx - pan.x);
  pan.y = cy - scale * (cy - pan.y);
  applyTransform();
}

function fitAll() {
  const rect = container.getBoundingClientRect();
  zoom = 0.75;
  pan.x = 80;
  pan.y = 80;
  applyTransform();
}

// ══════════════════════════════════════════════
// BOTTOM TOOLBAR — Add new zone
// ══════════════════════════════════════════════
const typeColors = {
  ideas: { color: '#1bc47d', colorDim: 'rgba(27,196,125,0.07)', borderColor: 'rgba(27,196,125,0.3)', name: 'New Ideas Zone' },
  strategy: { color: '#a259ff', colorDim: 'rgba(162,89,255,0.07)', borderColor: 'rgba(162,89,255,0.3)', name: 'New Strategy Zone' },
  insights: { color: '#4da6ff', colorDim: 'rgba(77,166,255,0.07)', borderColor: 'rgba(77,166,255,0.3)', name: 'New Insights Zone' },
  frameworks: { color: '#ff6b8a', colorDim: 'rgba(255,107,138,0.07)', borderColor: 'rgba(255,107,138,0.3)', name: 'New Frameworks Zone' },
};

document.querySelectorAll('.bottom-tool-btn[data-zone-type]').forEach(btn => {
  btn.addEventListener('click', () => {
    const type = btn.dataset.zoneType;
    const meta = typeColors[type];
    const newId = 'zone-' + Date.now();
    const rect = container.getBoundingClientRect();
    const cx = (rect.width / 2 - pan.x) / zoom;
    const cy = (rect.height / 2 - pan.y) / zoom;

    ZONES.push({
      id: newId,
      name: meta.name,
      type,
      color: meta.color,
      colorDim: meta.colorDim,
      borderColor: meta.borderColor,
      x: cx - 310, y: cy - 130,
      summary: 'Add your summary here.',
      cards: [
        { id: 'card-' + Date.now(), text: 'Click to edit this card. Double-click to rename the zone.' }
      ]
    });
    renderCanvas();
  });
});

// ══════════════════════════════════════════════
// CARD TYPE BTNS IN TOOLBAR — future new card
// ══════════════════════════════════════════════
