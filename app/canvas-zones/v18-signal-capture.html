<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seeds — V18 Signal Capture & Board as Input</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://esm.sh/@xyflow/react@12/dist/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react/": "https://esm.sh/react@18/",
      "react-dom": "https://esm.sh/react-dom@18",
      "react-dom/": "https://esm.sh/react-dom@18/",
      "@xyflow/react": "https://esm.sh/@xyflow/react@12?external=react,react-dom",
      "@xyflow/react/": "https://esm.sh/@xyflow/react@12&external=react,react-dom/"
    }
  }
  </script>
  <style>
    body { margin: 0; font-family: 'Outfit', sans-serif; background: #08080b; color: #e0e0e0; }

    .zone-ambient {
      border-radius: 14px;
      width: 100%; height: 100%;
      position: relative;
    }
    .zone-ambient-label {
      position: absolute;
      top: -12px;
      left: 16px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 6px;
      background: #08080b;
      z-index: 2;
    }
    .signal-meter {
      position: absolute;
      bottom: 8px;
      left: 14px;
      right: 14px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255,255,255,0.03);
      overflow: hidden;
      z-index: 2;
    }
    .signal-meter-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s;
    }

    .card-ambient {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px 14px;
      width: 195px;
      font-size: 13px;
      font-weight: 300;
      line-height: 1.5;
      color: #c0c0c0;
      transition: all 0.4s;
      position: relative;
    }
    .card-ambient .type-bar {
      width: 2px; border-radius: 1px;
      position: absolute; left: 3px; top: 8px; bottom: 8px;
    }

    /* Signal view states */
    .signal-view .card-ambient { opacity: 0.15; box-shadow: none; border-color: rgba(255,255,255,0.02); }
    .signal-view .card-ambient.sig-locked {
      opacity: 1;
      box-shadow: 0 0 20px rgba(234,193,245,0.15), 0 0 40px rgba(234,193,245,0.05);
      border-color: rgba(234,193,245,0.3);
    }
    .signal-view .card-ambient.sig-selected {
      opacity: 0.8;
      box-shadow: 0 0 12px rgba(234,193,245,0.08);
      border-color: rgba(234,193,245,0.15);
    }
    .signal-view .card-ambient.sig-edited {
      opacity: 0.9;
      box-shadow: 0 0 15px rgba(59,130,246,0.1);
      border-color: rgba(59,130,246,0.2);
    }
    .signal-view .card-ambient.sig-rejected {
      opacity: 0.08;
      border-color: rgba(239,68,68,0.1);
    }

    /* Board view states */
    .board-view .card-ambient.sig-locked {
      border-color: rgba(234,193,245,0.3);
      border-width: 1.5px;
    }
    .board-view .card-ambient.sig-selected {
      border-color: rgba(234,193,245,0.2);
    }
    .board-view .card-ambient.sig-rejected {
      opacity: 0.3;
      border-color: rgba(239,68,68,0.15);
    }

    .signal-sidebar {
      position: fixed;
      top: 48px;
      right: 0;
      width: 280px;
      height: calc(100vh - 48px);
      background: #0c0c10;
      border-left: 1px solid rgba(255,255,255,0.04);
      padding: 16px;
      overflow-y: auto;
      z-index: 90;
      font-size: 12px;
    }
    .signal-sidebar h4 {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #eac1f5;
      margin: 0 0 12px;
    }
    .signal-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.03);
      margin-bottom: 6px;
      font-size: 11px;
      line-height: 1.4;
      color: #aaa;
    }
    .signal-item .rank {
      font-size: 10px;
      font-weight: 500;
      color: #eac1f5;
      margin-right: 6px;
    }
    .signal-item .weight {
      font-size: 9px;
      color: #555;
      display: block;
      margin-top: 4px;
    }

    .generate-confidence {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(234,193,245,0.1);
      border: 1px solid rgba(234,193,245,0.2);
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      color: #eac1f5;
      cursor: pointer;
      z-index: 100;
      transition: all 0.2s;
    }
    .generate-confidence:hover {
      background: rgba(234,193,245,0.15);
    }

    .view-toggle {
      display: flex;
      gap: 2px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 2px;
    }
    .view-toggle button {
      padding: 5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 11px;
      font-weight: 500;
      color: #666;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      transition: all 0.2s;
    }
    .view-toggle button.active {
      background: rgba(234,193,245,0.12);
      color: #eac1f5;
    }

    .top-bar-ambient {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(8,8,11,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .react-flow__background { opacity: 0.15; }
    .react-flow__controls button { background: #151518 !important; color: #777 !important; border-color: #222 !important; }
    .react-flow__minimap { background: #0e0e12 !important; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="root" style="width:100vw;height:100vh;"></div>

  <script type="module">
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      ReactFlow,
      Background,
      Controls,
      MiniMap,
      useNodesState,
      useEdgesState,
      Handle,
      Position,
    } from '@xyflow/react';

    const h = React.createElement;

    const COLORS = { ideas: '#34d399', tensions: '#f472b6', signals: '#38bdf8', strategy: '#a78bfa' };

    function ZoneNode({ data }) {
      const color = COLORS[data.zoneType] || '#555';
      const strength = data.signalStrength || 0;
      return h('div', {
        className: 'zone-ambient',
        style: {
          width: '100%', height: '100%',
          border: `1px solid ${color}22`,
          background: `${color}04`,
        }
      },
        h('div', { className: 'zone-ambient-label', style: { color } }, data.label),
        h('div', { className: 'signal-meter' },
          h('div', {
            className: 'signal-meter-fill',
            style: { width: `${strength * 100}%`, background: `${color}66` },
          }),
        ),
      );
    }

    function CardNode({ data }) {
      const color = COLORS[data.cardType] || '#555';
      let sigClass = '';
      if (data.isLocked) sigClass = 'sig-locked';
      else if (data.isEdited) sigClass = 'sig-edited';
      else if (data.isSelected) sigClass = 'sig-selected';
      else if (data.isRejected) sigClass = 'sig-rejected';

      return h('div', {
        className: `card-ambient ${sigClass}`,
        style: { paddingLeft: '16px' },
      },
        h('div', { className: 'type-bar', style: { background: color } }),
        h('div', null, data.text),
        data.isLocked && h('span', { style: { position: 'absolute', top: '4px', right: '6px', fontSize: '9px', color: '#eac1f5' } }, '🔒'),
        h(Handle, { type: 'source', position: Position.Right, style: { opacity: 0, width: 6, height: 6 } }),
        h(Handle, { type: 'target', position: Position.Left, style: { opacity: 0, width: 6, height: 6 } }),
      );
    }

    const nodeTypes = { zone: ZoneNode, card: CardNode };

    const zoneData = [
      { id: 'z-high', label: 'Core Strategy', type: 'strategy', x: 40, y: 80, w: 480, h: 380, signal: 0.85 },
      { id: 'z-med', label: 'Emerging Ideas', type: 'ideas', x: 560, y: 80, w: 450, h: 380, signal: 0.45 },
      { id: 'z-low', label: 'Raw Signals', type: 'signals', x: 300, y: 500, w: 450, h: 300, signal: 0.2 },
    ];

    const cardData = {
      'z-high': [
        { t: 'Position as premium-accessible: luxury quality, democratic pricing', lock: true },
        { t: 'Community-driven product development as core brand ritual', lock: true },
        { t: 'Physical spaces as cultural hubs not retail stores', sel: true },
        { t: 'Content strategy: show process, never the pitch', edit: true },
        { t: 'Sustainability as operational truth, not marketing layer', sel: true },
      ],
      'z-med': [
        { t: 'Artist collaboration programme rotating quarterly', sel: true },
        { t: 'Repair workshops as brand touchpoints and loyalty drivers' },
        { t: 'Limited archive re-releases with modern reinterpretation' },
        { t: 'Digital twin product for virtual try-on experiences', rej: true },
        { t: 'Subscription capsule wardrobe service' },
      ],
      'z-low': [
        { t: 'Resale market growing 3x faster than new fashion' },
        { t: '73% Gen Z verify sustainability claims before purchase' },
        { t: 'TikTok maker content 3x engagement vs polished brand content' },
        { t: 'Repair culture mainstream — Patagonia Worn Wear revenue up 40%' },
      ],
    };

    const initialNodes = [];
    zoneData.forEach(z => {
      initialNodes.push({
        id: z.id,
        type: 'zone',
        position: { x: z.x, y: z.y },
        data: { label: z.label, zoneType: z.type, signalStrength: z.signal },
        style: { width: z.w, height: z.h },
      });
      cardData[z.id].forEach((c, i) => {
        initialNodes.push({
          id: `${z.id}-c${i}`,
          type: 'card',
          position: { x: 14 + (i % 2) * 215, y: 25 + Math.floor(i / 2) * 110 },
          parentId: z.id,
          extent: 'parent',
          data: {
            text: c.t,
            cardType: z.type,
            isLocked: c.lock || false,
            isSelected: c.sel || false,
            isRejected: c.rej || false,
            isEdited: c.edit || false,
          },
        });
      });
    });

    const signalRank = [
      { text: 'Position as premium-accessible: luxury quality, democratic pricing', weight: 'Locked — highest signal', rank: '1' },
      { text: 'Community-driven product development as core brand ritual', weight: 'Locked — highest signal', rank: '2' },
      { text: 'Content strategy: show process, never the pitch', weight: 'User-edited — high signal', rank: '3' },
      { text: 'Physical spaces as cultural hubs not retail stores', weight: 'Selected — medium signal', rank: '4' },
      { text: 'Sustainability as operational truth, not marketing layer', weight: 'Selected — medium signal', rank: '5' },
      { text: 'Artist collaboration programme rotating quarterly', weight: 'Selected — medium signal', rank: '6' },
    ];

    function App() {
      const [nodes, , onNodesChange] = useNodesState(initialNodes);
      const [edges, , onEdgesChange] = useEdgesState([]);
      const [view, setView] = useState('board');

      const strongSignals = initialNodes.filter(n => n.type === 'card' && (n.data.isLocked || n.data.isSelected || n.data.isEdited)).length;

      return h('div', { style: { width: '100vw', height: '100vh' }, className: view === 'signal' ? 'signal-view' : 'board-view' },
        h('div', { className: 'top-bar-ambient' },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
            h('span', { style: { fontWeight: 500, fontSize: '14px', color: '#e0e0e0' } }, 'Conscious Fashion Brand'),
            h('span', { style: { fontSize: '11px', color: '#555' } }, '3 zones · 14 cards'),
          ),
          h('div', { className: 'view-toggle' },
            h('button', { className: view === 'board' ? 'active' : '', onClick: () => setView('board') }, 'Board view'),
            h('button', { className: view === 'signal' ? 'active' : '', onClick: () => setView('signal') }, 'Signal view'),
          ),
        ),

        h(ReactFlow, {
          nodes, edges, onNodesChange, onEdgesChange,
          nodeTypes,
          fitView: true,
          fitViewOptions: { padding: 0.2 },
          style: { background: '#08080b' },
          proOptions: { hideAttribution: true },
        },
          h(Background, { gap: 24, size: 1, color: 'rgba(255,255,255,0.015)' }),
          h(Controls, { showInteractive: false }),
          h(MiniMap, {
            nodeColor: (n) => COLORS[n.data?.zoneType] || '#222',
          }),
        ),

        // Signal sidebar (visible in signal view)
        view === 'signal' && h('div', { className: 'signal-sidebar' },
          h('h4', null, 'Signal Ranking'),
          h('p', { style: { fontSize: '10px', color: '#555', marginBottom: '12px' } }, 'What the AI sees, ranked by weight'),
          ...signalRank.map((s, i) =>
            h('div', { key: i, className: 'signal-item' },
              h('span', { className: 'rank' }, `#${s.rank}`),
              s.text,
              h('span', { className: 'weight' }, s.weight),
            )
          ),
        ),

        // Generate button with confidence
        h('div', { className: 'generate-confidence' },
          `Generate → ${strongSignals} strong signals`,
        ),
      );
    }

    createRoot(document.getElementById('root')).render(h(App));
  </script>
</body>
</html>
